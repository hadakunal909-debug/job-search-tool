name: scrape

# Hourly job-feed update, 9am–6pm Eastern.
# GitHub cron is UTC and has no DST, so we fire every UTC hour that could fall in 9–18 ET
# in EITHER season (EDT=UTC-4 → 13–22, EST=UTC-5 → 14–23; union = 13–23 UTC) and then the
# run step trims scheduled runs to exactly 9–18 ET. Manual / app-button runs always scrape.
on:
  schedule:
    - cron: "0 13-23 * * *"   # hourly 13:00–23:00 UTC  → exactly 9am–6pm ET after the guard below
  workflow_dispatch: {}        # the app's "Update jobs" button (workflow_dispatch) + manual runs

# Never let two scrapes write the DB at once; a new trigger waits for the running one.
concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Update jobs (scheduled runs limited to 9am–6pm ET)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            H=$(TZ=America/New_York date +%H)
            if [ "$H" -lt 9 ] || [ "$H" -gt 18 ]; then
              echo "Outside 9am–6pm ET (hour=$H ET) — skipping this scheduled run."
              exit 0
            fi
            echo "Within window (hour=$H ET) — running scrape."
          fi
          python -m scraper
