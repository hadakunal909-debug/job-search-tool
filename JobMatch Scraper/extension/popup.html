<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: Inter, system-ui, Arial, sans-serif; width: 300px; margin: 0; padding: 14px; color: #111; }
    h3 { margin: 0 0 10px; font-size: 15px; }
    input { width: 100%; box-sizing: border-box; padding: 7px 9px; margin: 3px 0; border: 1px solid #cbd5e1; border-radius: 7px; font-size: 13px; }
    button { width: 100%; padding: 9px; margin: 5px 0; border: 0; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .primary { background: #0e8a5f; color: #fff; }
    .ghost { background: #eef2f7; color: #222; }
    .msg { font-size: 12px; margin: 6px 0 0; min-height: 15px; color: #0b7a52; }
    .lbl { font-size: 11px; color: #666; margin-top: 8px; }
    details { margin-top: 12px; }
    summary { font-size: 12px; cursor: pointer; color: #888; }
    a { color: #0e8a5f; }
  </style>
</head>
<body>
  <h3>🎯 JobMatch Helper</h3>

  <div id="main" style="display:none">
    <div class="lbl">Job title</div><input id="title">
    <div class="lbl">Company</div><input id="company">
    <div class="lbl">Résumé used</div><input id="resume" list="rnames" placeholder="e.g. Kunal_PM_Resume.pdf">
    <datalist id="rnames"></datalist>
    <div id="tailorwrap" style="display:none">
      <button class="primary" id="tailorfill">✨ Tailor résumé &amp; fill this application</button>
      <div class="msg" id="tailormsg"></div>
    </div>
    <button class="ghost" id="save">📌 Just save to tracker</button>
    <div class="msg" id="msg"></div>
    <div id="bulkwrap" style="display:none; margin-top:10px; padding-top:10px; border-top:1px solid #e5e9f0">
      <div class="lbl" id="bulklbl" style="margin-top:0"></div>
      <button class="ghost" id="bulk">Import all jobs on this page → feed</button>
      <div class="msg" id="bulkmsg"></div>
    </div>
    <div style="margin-top:10px; padding-top:10px; border-top:1px solid #e5e9f0">
      <button class="ghost" id="boardcheck">🔍 Can this site be auto-scraped daily?</button>
      <div class="msg" id="boardmsg"></div>
    </div>
    <div style="margin-top:10px; padding-top:10px; border-top:1px solid #e5e9f0">
      <div class="lbl" id="autostat" style="margin-top:0">🤖 Tesla auto-import: not run yet</div>
      <button class="ghost" id="teslanow">Run Tesla import now</button>
      <div class="msg" id="teslamsg"></div>
    </div>
    <details>
      <summary>settings</summary>
      <button class="ghost" id="reset" style="margin-top:6px">Change token / app URL</button>
    </details>
  </div>

  <div id="setup">
    <div class="lbl">Token (from the Profile page in JobMatch)</div>
    <input id="token" placeholder="username:xxxxxxxx">
    <div class="lbl">App URL</div>
    <input id="apibase" value="https://stemjobs.astrochakra.co">
    <button class="primary" id="savetok">Save</button>
    <div class="msg" id="setupmsg"></div>
  </div>

  <script src="tesla_shared.js"></script>
  <script src="filler.js"></script>
  <script src="popup.js"></script>
</body>
</html>
