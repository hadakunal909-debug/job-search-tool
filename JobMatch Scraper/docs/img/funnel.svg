<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 772" width="980" height="772" role="img" aria-label="Where a scraped posting gets dropped, and what the run prints">
<title>Where a scraped posting gets dropped, and what the run prints</title>
<text class="t-dim" x="0" y="22" font-family=""InterVariable",Inter,-apple-system,"Segoe UI",Roboto,sans-serif" font-size="13" fill="#4e5462" text-anchor="start" font-weight="400">Every gate the intake loop applies, in order. The label on each chute is the exact string the run prints.</text>
<rect class="s-sched" x="180" y="40" width="460" height="111" rx="10" fill="#cfe8e3" stroke="#0f766e" stroke-width="1.5"/>
<text class="t-sched" x="194" y="56" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" letter-spacing="0.08em" fill="#0b5c56">◷ SCHEDULED</text>
<text class="t-ink" x="194" y="76" font-family=""InterVariable",Inter,-apple-system,"Segoe UI",Roboto,sans-serif" font-size="14.5" font-weight="600" fill="#101319">1,192 boards -&gt; scrape_all</text>
<text class="t-dim" x="194" y="95" font-family=""InterVariable",Inter,-apple-system,"Segoe UI",Roboto,sans-serif" font-size="12.5" fill="#4e5462">38 ATS adapters, thread pool, per-host caps</text>
<text class="t-dim" x="194" y="111" font-family=""InterVariable",Inter,-apple-system,"Segoe UI",Roboto,sans-serif" font-size="12.5" fill="#4e5462">then fill_missing_jds() buys descriptions BEFORE the gates,</text>
<text class="t-dim" x="194" y="127" font-family=""InterVariable",Inter,-apple-system,"Segoe UI",Roboto,sans-serif" font-size="12.5" fill="#4e5462">so a JD-rescued row takes the same path as a title match</text>
