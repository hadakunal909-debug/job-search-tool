<text class="t-dim" x="700" y="426" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#4e5462" text-anchor="start" font-weight="400">scraper/__init__.py:8548</text>
