<path class="edge" d="M410 482 L410 516" stroke="#d3d7df" stroke-width="1.5" fill="none"/>
<path class="arrowhead" d="M406 510 L414 510 L410 516 Z" fill="#d3d7df"/>
<rect class="s-sched" x="150" y="516" width="520" height="111" rx="10" fill="#cfe8e3" stroke="#0f766e" stroke-width="1.5"/>
<text class="t-sched" x="164" y="532" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" letter-spacing="0.08em" fill="#0b5c56">◷ SCHEDULED</text>
<text class="t-ink" x="164" y="552" font-family=""InterVariable",Inter,-apple-system,"Segoe UI",Roboto,sans-serif" font-size="14.5" font-weight="600" fill="#101319">kept</text>
<text class="t-dim" x="164" y="571" font-family=""InterVariable",Inter,-apple-system,"Segoe UI",Roboto,sans-serif" font-size="12.5" fill="#4e5462">written to last_new_jobs.json BEFORE any database call, so a DB</text>
<text class="t-dim" x="164" y="587" font-family=""InterVariable",Inter,-apple-system,"Segoe UI",Roboto,sans-serif" font-size="12.5" fill="#4e5462">hiccup cannot lose the scrape -- then insert, listing JDs, prune,</text>
<text class="t-dim" x="164" y="603" font-family=""InterVariable",Inter,-apple-system,"Segoe UI",Roboto,sans-serif" font-size="12.5" fill="#4e5462">liveness reconcile, board health, status handoff</text>
<path class="edge" d="M0 622 L960 622" stroke="#d3d7df" stroke-width="1"/>
<text class="t-dim" x="0" y="644" font-family=""InterVariable",Inter,-apple-system,"Segoe UI",Roboto,sans-serif" font-size="12.5" fill="#0b5c56" text-anchor="start" font-weight="600">A job whose TITLE matched nothing can still be admitted on what its DESCRIPTION says.</text>
<text class="t-dim" x="0" y="662" font-family=""InterVariable",Inter,-apple-system,"Segoe UI",Roboto,sans-serif" font-size="12.5" fill="#4e5462" text-anchor="start" font-weight="400">That is a keep, not a drop, so it has no chute here -- and because the descriptions are bought before the gates,</text>
<text class="t-dim" x="0" y="678" font-family=""InterVariable",Inter,-apple-system,"Segoe UI",Roboto,sans-serif" font-size="12.5" fill="#4e5462" text-anchor="start" font-weight="400">a rescued row takes exactly the same path as a title match rather than a special one.</text>
</svg>
