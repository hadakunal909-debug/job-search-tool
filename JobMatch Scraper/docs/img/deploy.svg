<text class="t-sched" x="498" y="202" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" letter-spacing="0.08em" fill="#0b5c56">◷ SCHEDULED</text>
<text class="t-dim" x="498" y="222" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#4e5462">File Manager: upload, extract</text>
<text class="t-dim" x="498" y="238" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#4e5462">cPanel</text>
<path class="edge" d="M716 217 L726 217" stroke="#d3d7df" stroke-width="1.5" fill="none"/>
<path class="arrowhead" d="M720 213 L720 221 L726 217 Z" fill="#d3d7df"/>
<rect class="s-sched" x="726" y="186" width="232" height="76" rx="10" fill="#cfe8e3" stroke="#0f766e" stroke-width="1.5"/>
<text class="t-sched" x="740" y="202" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" letter-spacing="0.08em" fill="#0b5c56">◷ SCHEDULED</text>
<text class="t-dim" x="740" y="222" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#4e5462">touch tmp/restart.txt</text>
<text class="t-dim" x="740" y="238" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#4e5462">Passenger reloads</text>
<text class="t-dim" x="0" y="268" font-family=""InterVariable",Inter,-apple-system,"Segoe UI",Roboto,sans-serif" font-size="12.5" fill="#4e5462" text-anchor="start" font-weight="400">The script refuses to build when its own file list and .cpanel.yml disagree about a module web.py imports.</text>
<path class="edge" d="M0 288 L960 288" stroke="#d3d7df" stroke-width="1"/>
<text class="t-dim" x="0" y="314" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#101319" text-anchor="start" font-weight="600">AND IT RUNS ITSELF THREE TIMES A WEEKDAY, ON TWO DIFFERENT RUNNERS</text>
<rect class="s-trap" x="0" y="328" width="960" height="34" rx="6" fill="#f9edcd" stroke="#a8781a" stroke-width="1"/>
<text class="t-dim" x="14" y="350" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#8a5a08" text-anchor="start" font-weight="600">09:00 M-F</text>
<text class="t-dim" x="120" y="350" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#101319" text-anchor="start" font-weight="400">.github/workflows/scrape.yml</text>
<text class="t-dim" x="400" y="350" font-family=""InterVariable",Inter,-apple-system,"Segoe UI",Roboto,sans-serif" font-size="12" fill="#4e5462" text-anchor="start" font-weight="400">heavy: sweep, full score, verify_dates, analytics, digest email</text>
