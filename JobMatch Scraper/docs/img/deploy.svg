<text class="t-ink" x="314" y="54" font-family=""InterVariable",Inter,-apple-system,"Segoe UI",Roboto,sans-serif" font-size="14.5" font-weight="600" fill="#101319">GitHub</text>
<text class="t-dim" x="314" y="73" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#4e5462">origin</text>
<path class="edge-dead" d="M470 60 L600 60" stroke="#b3261e" stroke-width="1.5" fill="none" stroke-dasharray="5 4"/>
<path class="arrowhead" d="M594 56 L594 64 L600 60 Z" fill="#b3261e"/>
<path class="edge-dead" d="M528 53 L542 67" stroke="#b3261e" stroke-width="2.5"/>
<path class="edge-dead" d="M528 67 L542 53" stroke="#b3261e" stroke-width="2.5"/>
<rect class="s-trap" x="600" y="32" width="240" height="79" rx="10" fill="#f9edcd" stroke="#a8781a" stroke-width="1.5"/>
<text class="t-trap" x="614" y="48" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" letter-spacing="0.08em" fill="#8a5a08">⚠ TRAP</text>
<text class="t-ink" x="614" y="68" font-family=""InterVariable",Inter,-apple-system,"Segoe UI",Roboto,sans-serif" font-size="14.5" font-weight="600" fill="#101319">.cpanel.yml</text>
<text class="t-dim" x="614" y="87" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#4e5462">never runs</text>
<text class="t-dim" x="0" y="108" font-family=""InterVariable",Inter,-apple-system,"Segoe UI",Roboto,sans-serif" font-size="12.5" fill="#b3261e" text-anchor="start" font-weight="400">cPanel executes .cpanel.yml only for a repository HOSTED ON CPANEL, and this origin is GitHub.</text>
<text class="t-dim" x="0" y="124" font-family=""InterVariable",Inter,-apple-system,"Segoe UI",Roboto,sans-serif" font-size="12.5" fill="#4e5462" text-anchor="start" font-weight="400">Nothing on the server ever hears about a push. Verified 2026-08-09 by pushing a release and polling the served CSS.</text>
<path class="edge" d="M0 146 L960 146" stroke="#d3d7df" stroke-width="1"/>
<text class="t-dim" x="0" y="172" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#0b5c56" text-anchor="start" font-weight="600">THE PATH THAT IS THE DEPLOY</text>
<rect class="s-sched" x="0" y="186" width="184" height="76" rx="10" fill="#cfe8e3" stroke="#0f766e" stroke-width="1.5"/>
<text class="t-sched" x="14" y="202" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" letter-spacing="0.08em" fill="#0b5c56">◷ SCHEDULED</text>
<text class="t-dim" x="14" y="222" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#4e5462">build_deploy_zip.py</text>
<text class="t-dim" x="14" y="238" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#4e5462">19 modules + 4 dirs</text>
<path class="edge" d="M184 217 L194 217" stroke="#d3d7df" stroke-width="1.5" fill="none"/>
<path class="arrowhead" d="M188 213 L188 221 L194 217 Z" fill="#d3d7df"/>
<rect class="s-sched" x="194" y="186" width="184" height="76" rx="10" fill="#cfe8e3" stroke="#0f766e" stroke-width="1.5"/>
<text class="t-sched" x="208" y="202" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" letter-spacing="0.08em" fill="#0b5c56">◷ SCHEDULED</text>
<text class="t-dim" x="208" y="222" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#4e5462">stemjobs1_deploy.zip</text>
<text class="t-dim" x="208" y="238" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#4e5462">flat archive</text>
<path class="edge" d="M378 217 L388 217" stroke="#d3d7df" stroke-width="1.5" fill="none"/>
<path class="arrowhead" d="M382 213 L382 221 L388 217 Z" fill="#d3d7df"/>
<rect class="s-sched" x="388" y="186" width="184" height="76" rx="10" fill="#cfe8e3" stroke="#0f766e" stroke-width="1.5"/>
<text class="t-sched" x="402" y="202" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" letter-spacing="0.08em" fill="#0b5c56">◷ SCHEDULED</text>
<text class="t-dim" x="402" y="222" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#4e5462">upload + extract</text>
<text class="t-dim" x="402" y="238" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#4e5462">cPanel File Manager</text>
<path class="edge" d="M572 217 L582 217" stroke="#d3d7df" stroke-width="1.5" fill="none"/>
<path class="arrowhead" d="M576 213 L576 221 L582 217 Z" fill="#d3d7df"/>
<rect class="s-sched" x="582" y="186" width="184" height="76" rx="10" fill="#cfe8e3" stroke="#0f766e" stroke-width="1.5"/>
<text class="t-sched" x="596" y="202" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" letter-spacing="0.08em" fill="#0b5c56">◷ SCHEDULED</text>
<text class="t-dim" x="596" y="222" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#4e5462">touch tmp/restart.txt</text>
<text class="t-dim" x="596" y="238" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#4e5462">Passenger reloads</text>
<path class="edge" d="M766 217 L776 217" stroke="#d3d7df" stroke-width="1.5" fill="none"/>
<path class="arrowhead" d="M770 213 L770 221 L776 217 Z" fill="#d3d7df"/>
<rect class="s-sched" x="776" y="186" width="184" height="76" rx="10" fill="#cfe8e3" stroke="#0f766e" stroke-width="1.5"/>
<text class="t-sched" x="790" y="202" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" letter-spacing="0.08em" fill="#0b5c56">◷ SCHEDULED</text>
<text class="t-dim" x="790" y="222" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#4e5462">curl /warm?t=...</text>
<text class="t-dim" x="790" y="238" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#4e5462">else visitor 1 pays</text>
<text class="t-dim" x="0" y="268" font-family=""InterVariable",Inter,-apple-system,"Segoe UI",Roboto,sans-serif" font-size="12.5" fill="#4e5462" text-anchor="start" font-weight="400">The script refuses to build when its own file list and .cpanel.yml disagree about a module web.py imports.</text>
<path class="edge" d="M0 288 L960 288" stroke="#d3d7df" stroke-width="1"/>
<text class="t-dim" x="0" y="314" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#101319" text-anchor="start" font-weight="600">AND THE PIPELINE RUNS ITSELF ON A SCHEDULE, ACROSS TWO RUNNERS</text>
<rect class="s-trap" x="0" y="328" width="960" height="34" rx="6" fill="#f9edcd" stroke="#a8781a" stroke-width="1"/>
<text class="t-dim" x="14" y="350" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#8a5a08" text-anchor="start" font-weight="600">~08-09:00 M-F</text>
<text class="t-dim" x="120" y="350" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#101319" text-anchor="start" font-weight="400">.github/workflows/scrape.yml</text>
<text class="t-dim" x="400" y="350" font-family=""InterVariable",Inter,-apple-system,"Segoe UI",Roboto,sans-serif" font-size="12" fill="#4e5462" text-anchor="start" font-weight="400">heavy: sweep, full score, verify_dates, analytics, reposts, digest email</text>
<rect class="s-sched" x="0" y="368" width="960" height="34" rx="6" fill="#cfe8e3" stroke="#0f766e" stroke-width="1"/>
<text class="t-dim" x="14" y="390" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#0b5c56" text-anchor="start" font-weight="600">13:00 M-F</text>
<text class="t-dim" x="120" y="390" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#101319" text-anchor="start" font-weight="400">bin/cron_scrape.sh</text>
<text class="t-dim" x="400" y="390" font-family=""InterVariable",Inter,-apple-system,"Segoe UI",Roboto,sans-serif" font-size="12" fill="#4e5462" text-anchor="start" font-weight="400">sweep, new-only score, reposts</text>
<rect class="s-sched" x="0" y="408" width="960" height="34" rx="6" fill="#cfe8e3" stroke="#0f766e" stroke-width="1"/>
<text class="t-dim" x="14" y="430" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#0b5c56" text-anchor="start" font-weight="600">16:00 M-F</text>
<text class="t-dim" x="120" y="430" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#101319" text-anchor="start" font-weight="400">bin/cron_scrape.sh</text>
<text class="t-dim" x="400" y="430" font-family=""InterVariable",Inter,-apple-system,"Segoe UI",Roboto,sans-serif" font-size="12" fill="#4e5462" text-anchor="start" font-weight="400">sweep, new-only score, reposts</text>
<rect class="s-sched" x="0" y="448" width="960" height="34" rx="6" fill="#cfe8e3" stroke="#0f766e" stroke-width="1"/>
<text class="t-dim" x="14" y="470" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#0b5c56" text-anchor="start" font-weight="600">:30 hourly M-F</text>
<text class="t-dim" x="120" y="470" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#101319" text-anchor="start" font-weight="400">bin/cron_scrape.sh --analyze-only</text>
<text class="t-dim" x="400" y="470" font-family=""InterVariable",Inter,-apple-system,"Segoe UI",Roboto,sans-serif" font-size="12" fill="#4e5462" text-anchor="start" font-weight="400">writes jd_terms, then refills the stored user scores</text>
<rect class="s-sched" x="0" y="488" width="960" height="34" rx="6" fill="#cfe8e3" stroke="#0f766e" stroke-width="1"/>
<text class="t-dim" x="14" y="510" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#0b5c56" text-anchor="start" font-weight="600">every 5 min</text>
<text class="t-dim" x="120" y="510" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#101319" text-anchor="start" font-weight="400">crontab: curl /warm x4</text>
<text class="t-dim" x="400" y="510" font-family=""InterVariable",Inter,-apple-system,"Segoe UI",Roboto,sans-serif" font-size="12" fill="#4e5462" text-anchor="start" font-weight="400">one call warms one worker; flock-guarded so a sweep is not re-fattened</text>
<rect class="s-trap" x="0" y="528" width="960" height="34" rx="6" fill="#f9edcd" stroke="#a8781a" stroke-width="1"/>
<text class="t-dim" x="14" y="550" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#8a5a08" text-anchor="start" font-weight="600">hourly</text>
<text class="t-dim" x="120" y="550" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#101319" text-anchor="start" font-weight="400">.github/workflows/scrape-watchdog.yml</text>
<text class="t-dim" x="400" y="550" font-family=""InterVariable",Inter,-apple-system,"Segoe UI",Roboto,sans-serif" font-size="12" fill="#4e5462" text-anchor="start" font-weight="400">dispatches scrape.yml when the scheduled event never arrived</text>
<rect class="s-client" x="0" y="568" width="960" height="34" rx="6" fill="#e4e7ec" stroke="#5f6573" stroke-width="1"/>
<text class="t-dim" x="14" y="590" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#3c414d" text-anchor="start" font-weight="600">16:00 Tue+Thu</text>
<text class="t-dim" x="120" y="590" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#101319" text-anchor="start" font-weight="400">.github/workflows/jobspy-sweep.yml</text>
<text class="t-dim" x="400" y="590" font-family=""InterVariable",Inter,-apple-system,"Segoe UI",Roboto,sans-serif" font-size="12" fill="#4e5462" text-anchor="start" font-weight="400">aggregator sidecar -&gt; jobspy_findings; never the feed</text>
<text class="t-dim" x="0" y="626" font-family=""InterVariable",Inter,-apple-system,"Segoe UI",Roboto,sans-serif" font-size="12.5" fill="#8a5a08" text-anchor="start" font-weight="400">The cron rows live in the live crontab and nowhere else. The repo cannot enforce them, so they are</text>
<text class="t-dim" x="0" y="642" font-family=""InterVariable",Inter,-apple-system,"Segoe UI",Roboto,sans-serif" font-size="12.5" fill="#8a5a08" text-anchor="start" font-weight="400">recorded in the header of bin/cron_scrape.sh -- and a scheduled Actions event is not a guarantee, which is what the watchdog is for.</text>
</svg>
