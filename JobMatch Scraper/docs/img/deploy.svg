<text class="t-dim" x="256" y="222" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#4e5462">stemjobs1_deploy.zip</text>
<text class="t-dim" x="256" y="238" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#4e5462">flat archive</text>
