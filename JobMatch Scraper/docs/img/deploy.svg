<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 670" width="980" height="670" role="img" aria-label="How this app actually deploys, and the path that looks like it does">
<title>How this app actually deploys, and the path that looks like it does</title>
<text class="t-dim" x="0" y="20" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#b3261e" text-anchor="start" font-weight="600">THE PATH THAT LOOKS LIKE A DEPLOY AND IS NOT</text>
<rect class="s-plain" x="0" y="32" width="190" height="65" rx="10" fill="#ffffff" stroke="#d3d7df" stroke-width="1.5"/>
<text class="t-ink" x="14" y="54" font-family=""InterVariable",Inter,-apple-system,"Segoe UI",Roboto,sans-serif" font-size="14.5" font-weight="600" fill="#101319">your laptop</text>
<text class="t-dim" x="14" y="73" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#4e5462">git push</text>
<path class="edge" d="M190 60 L300 60" stroke="#d3d7df" stroke-width="1.5" fill="none"/>
<path class="arrowhead" d="M294 56 L294 64 L300 60 Z" fill="#d3d7df"/>
