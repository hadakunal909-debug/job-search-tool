<text class="t-dim" x="120" y="430" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#101319" text-anchor="start" font-weight="400">bin/cron_scrape.sh</text>
<text class="t-dim" x="400" y="430" font-family=""InterVariable",Inter,-apple-system,"Segoe UI",Roboto,sans-serif" font-size="12" fill="#4e5462" text-anchor="start" font-weight="400">sweep, new-only score, reposts</text>
<text class="t-dim" x="0" y="466" font-family=""InterVariable",Inter,-apple-system,"Segoe UI",Roboto,sans-serif" font-size="12.5" fill="#8a5a08" text-anchor="start" font-weight="400">The two cron rows live in cPanel -&gt; Cron Jobs and nowhere else. The repo cannot enforce them, so they are</text>
<text class="t-dim" x="0" y="482" font-family=""InterVariable",Inter,-apple-system,"Segoe UI",Roboto,sans-serif" font-size="12.5" fill="#8a5a08" text-anchor="start" font-weight="400">recorded in the header of bin/cron_scrape.sh.</text>
