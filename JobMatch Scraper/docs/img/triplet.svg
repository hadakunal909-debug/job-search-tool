<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" width="980" height="380" role="img" aria-label="The three implementations of 'does this job match this search'">
<title>The three implementations of 'does this job match this search'</title>
<text class="t-dim" x="0" y="22" font-family=""InterVariable",Inter,-apple-system,"Segoe UI",Roboto,sans-serif" font-size="13" fill="#4e5462" text-anchor="start" font-weight="400">One question, three answers that must agree.</text>
<rect class="s-web" x="0" y="40" width="380" height="111" rx="10" fill="#e0e4fe" stroke="#4f46e5" stroke-width="1.5"/>
<text class="t-web" x="14" y="56" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" letter-spacing="0.08em" fill="#3730a3">▣ REQUEST</text>
<text class="t-ink" x="14" y="76" font-family=""InterVariable",Inter,-apple-system,"Segoe UI",Roboto,sans-serif" font-size="14.5" font-weight="600" fill="#101319">the server feed</text>
<text class="t-dim" x="14" y="95" font-family=""InterVariable",Inter,-apple-system,"Segoe UI",Roboto,sans-serif" font-size="12.5" fill="#4e5462">web.py::_filter_rows</text>
<text class="t-dim" x="14" y="111" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#4e5462">line 2418</text>
<text class="t-dim" x="14" y="127" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#4e5462">docstring: &quot;Server-side mirror of app.js&quot;</text>
<rect class="s-client" x="580" y="40" width="380" height="111" rx="10" fill="#e4e7ec" stroke="#5f6573" stroke-width="1.5"/>
<text class="t-client" x="594" y="56" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" letter-spacing="0.08em" fill="#3c414d">◻ BROWSER</text>
<text class="t-ink" x="594" y="76" font-family=""InterVariable",Inter,-apple-system,"Segoe UI",Roboto,sans-serif" font-size="14.5" font-weight="600" fill="#101319">the client feed</text>
<text class="t-dim" x="594" y="95" font-family=""InterVariable",Inter,-apple-system,"Segoe UI",Roboto,sans-serif" font-size="12.5" fill="#4e5462">static/app.js::matches()</text>
<text class="t-dim" x="594" y="111" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#4e5462">line 825</text>
<text class="t-dim" x="594" y="127" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#4e5462">runs in the visitor's browser</text>
<path class="edge" d="M380 86 L575 86" stroke="#d3d7df" stroke-width="1.5" fill="none"/>
<path class="arrowhead" d="M569 82 L569 90 L575 86 Z" fill="#d3d7df"/>
<text class="t-dim" x="480" y="70" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#101319" text-anchor="middle" font-weight="600">_FEED_INLINE_MAX = 4000</text>
<text class="t-dim" x="480" y="108" font-family=""InterVariable",Inter,-apple-system,"Segoe UI",Roboto,sans-serif" font-size="11" fill="#4e5462" text-anchor="middle" font-weight="400">at or below -&gt; the BROWSER filters</text>
<text class="t-dim" x="480" y="122" font-family=""InterVariable",Inter,-apple-system,"Segoe UI",Roboto,sans-serif" font-size="11" fill="#4e5462" text-anchor="middle" font-weight="400">above -&gt; the SERVER filters</text>
<rect class="s-trap" x="230" y="176" width="500" height="92" rx="10" fill="#f9edcd" stroke="#a8781a" stroke-width="1.5"/>
<text class="t-trap" x="244" y="192" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" letter-spacing="0.08em" fill="#8a5a08">⚠ TRAP</text>
<text class="t-dim" x="244" y="212" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#4e5462">The only thing keeping these two in step:  scripts/feed_parity.py</text>
<text class="t-dim" x="244" y="228" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#4e5462">It lifts the JS functions out of app.js BY SOURCE TEXT and runs them in node,</text>
<text class="t-dim" x="244" y="244" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#4e5462">so a copy cannot drift from what ships. A helper must stay a top-level function.</text>
<path class="edge" d="M190 132 L190 154 L300 154 L300 176" stroke="#d3d7df" stroke-width="1.5" fill="none"/>
<path class="arrowhead" d="M296 170 L304 170 L300 176 Z" fill="#d3d7df"/>
<path class="edge" d="M770 132 L770 154 L660 154 L660 176" stroke="#d3d7df" stroke-width="1.5" fill="none"/>
<path class="arrowhead" d="M656 170 L664 170 L660 176 Z" fill="#d3d7df"/>
<path class="edge" d="M480 238 L480 274" stroke="#d3d7df" stroke-width="1.5" fill="none" stroke-dasharray="5 4"/>
<path class="arrowhead" d="M476 268 L484 268 L480 274 Z" fill="#d3d7df"/>
<rect class="s-sched" x="230" y="274" width="500" height="111" rx="10" fill="#cfe8e3" stroke="#0f766e" stroke-width="1.5"/>
<text class="t-sched" x="244" y="290" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" letter-spacing="0.08em" fill="#0b5c56">◷ SCHEDULED</text>
<text class="t-ink" x="244" y="310" font-family=""InterVariable",Inter,-apple-system,"Segoe UI",Roboto,sans-serif" font-size="14.5" font-weight="600" fill="#101319">the email digest</text>
<text class="t-dim" x="244" y="329" font-family=""InterVariable",Inter,-apple-system,"Segoe UI",Roboto,sans-serif" font-size="12.5" fill="#4e5462">core.py::prefs_match  --  line 2927</text>
<text class="t-dim" x="244" y="345" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#4e5462">Shares the filters, not the whole thing: it skips &quot;posted within&quot;,</text>
<text class="t-dim" x="244" y="361" font-family=""IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#4e5462">because every candidate in a digest is new. _filter_rows stays the authority.</text>
</svg>
