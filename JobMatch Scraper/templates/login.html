{% extends "base.html" %}
{% block content %}
<div class="login">
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#0e8a5f"/><circle cx="16" cy="16" r="8.5" fill="none" stroke="#fff" stroke-width="2.4"/><circle cx="16" cy="16" r="3.6" fill="#fff"/></svg>
    <span>Job<b>Match</b></span>
  </div>
  <p class="sub">Sign in to see your matched jobs.</p>
  <form method="post">
    <input name="username" placeholder="Username" autofocus required>
    <input name="password" type="password" placeholder="Password" required>
    <button class="btn primary" type="submit">Log in</button>
  </form>
</div>
{% endblock %}
