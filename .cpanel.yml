---
# cPanel Git deploy. Runs on push; copies the app into DEPLOYPATH and restarts Passenger.
#
# DEPLOYPATH uses $HOME rather than a hardcoded /home/<user>. cPanel runs these tasks as the
# account that owns the repository, so $HOME always resolves to the right home directory —
# which is what stops this breaking again the next time the app moves accounts.
#
# It broke exactly that way once: the path was pinned to /home/bnrqpozr/Stemjobs, the
# stemjobs.astrochakra.co account was suspended around 2026-07-21, and the app moved to
# stemjobs1.astrochakra.co under a different cPanel user. Every deploy after that copied
# files into a home nobody served, reported success, and changed nothing.
#
# `stemjobs` is the Python app root shown in cPanel -> Setup Python App -> Application root.
# If that folder is ever renamed, this line is the only thing that needs changing.
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/stemjobs
    - export SRC="JobMatch Scraper"
    # Fail loudly on a wrong path instead of quietly deploying into nowhere. The previous
    # breakage was silent precisely because nothing checked: cp into a missing tree, mkdir -p
    # later recreating it, deploy reports success. A missing directory here means the app root
    # was renamed or this is the wrong account — either way, stop.
    # (quoted: an unquoted YAML scalar containing ": " parses as a mapping, not a command)
    - 'test -d "$DEPLOYPATH" || { echo "DEPLOY ABORTED - $DEPLOYPATH does not exist. Check cPanel Setup Python App -> Application root, then update DEPLOYPATH in .cpanel.yml."; exit 1; }'
    # NOTE analytics.py belongs in this list: web.py imports it at module scope. The import is
    # written defensively so a missing file degrades to "no usage tracking" rather than a dead
    # site, but leaving it out silently turns the feature off — add new top-level modules here.
    # jdrender.py is not optional: web.py imports it at module scope, so a copy without it is a
    # site that ImportErrors on its first request. scripts/build_deploy_zip.py now refuses to
    # build when this line and its own FILES list disagree about a module web.py imports.
    - /bin/cp -f "$SRC/web.py" "$SRC/core.py" "$SRC/db.py" "$SRC/auth.py" "$SRC/analytics.py" "$SRC/jdrender.py" "$SRC/passenger_wsgi.py" "$SRC/requirements-cpanel.txt" "$SRC/idf.json" "$SRC/careers_us.md" "$SRC/sponsors.txt" $DEPLOYPATH/
    # Optional data files: the H-1B filing counts that turn on the sponsor-strength tiers, the
    # per-year approvals history behind the company panel's chart, the visa-route index, and the
    # E-Verify snapshot that turns on the STEM-OPT badge. Copied only if present so a missing
    # one can't fail the deploy — each feature stays dormant until its file exists, which is the
    # same contract core.load_sponsor_counts / load_sponsor_years / load_everify already have.
    - for f in sponsor_counts.json sponsor_years.json visa_tags.json everify.txt; do test -f "$SRC/$f" && /bin/cp -f "$SRC/$f" $DEPLOYPATH/ || true; done
    - /bin/cp -rf "$SRC/scraper" $DEPLOYPATH/
    - /bin/cp -rf "$SRC/resume_brain" $DEPLOYPATH/
    - /bin/cp -rf "$SRC/templates" $DEPLOYPATH/
    - /bin/cp -rf "$SRC/static" $DEPLOYPATH/
    - /bin/mkdir -p $DEPLOYPATH/tmp
    - /bin/touch $DEPLOYPATH/tmp/restart.txt
