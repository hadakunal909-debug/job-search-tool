name: python tests

# THE GAP THIS CLOSES. web-build.yml is path-filtered to 'JobMatch Scraper/web/**' and
# 'static/dist/**', so until now a change to web.py (5,852 lines), core.py, db.py or
# scraper/__init__.py triggered NO workflow at all. The repo has 21 self-contained suites and
# roughly 400 assertions — most of which encode a real production incident and explain why the
# naive fix was wrong — and not one of them had ever run in CI.
#
# Its own workflow rather than a job inside scrape.yml, for the reason that file already gives:
# scrape.yml runs on a metered cron budget and the free Actions minutes have been hit before.
# This one is path-filtered and finishes in about two minutes, so it costs ~nothing per month.
#
# EVERY suite listed below was verified to run with the network physically blocked (sockets
# patched to raise) and no .env present, which is what a CI runner looks like. Three suites are
# deliberately NOT here — test_prefs.py and test_saved_search.py need a live database.
#
# test_ext_contract.py USED to be excluded for the same reason, and that was the wrong call: it
# guards the eleven /api/ext/* routes the Chrome extension depends on, and nothing else does,
# so a _cors() or OPTIONS refactor could ship green and surface days later as "the extension
# stopped working". It was excluded because with no credentials it printed "No accounts" and
# exited 0 — a green tick that proved nothing. It now runs its data-free half instead (route
# registration, token rejection, the version endpoint, CORS preflight), none of which needs a
# database, and skips only the response-shape section that genuinely does.

on:
  push:
    paths:
      - 'JobMatch Scraper/**.py'
      # static/** REPLACES the two named files, 2026-08-22. The old filter listed app.js and
      # style.css only, so static/companies.js -- which draws the whole /companies grid -- has
      # been outside CI since it was written, and static/logos/** plus companies.json would let
      # a whole logo harvest land without running a single test. That is precisely how 'no test
      # asserts on logo markup' was possible.
      - 'JobMatch Scraper/static/**'
      - 'JobMatch Scraper/companies.json'
      - 'JobMatch Scraper/templates/**'
      # docs/ triggered NO workflow at all before 2026-08-20 — this file filtered on .py and
      # static/, and web-build.yml on web/ and static/dist/. A docs gate outside the path
      # filter is a gate that never runs, so hand-editing a generated file would have gone
      # unnoticed. **.py already covers scripts/build_docs.py; this covers its output.
      - 'JobMatch Scraper/docs/**'
      - '.github/workflows/python-tests.yml'
  pull_request:
    paths:
      - 'JobMatch Scraper/**.py'
      - 'JobMatch Scraper/static/**'
      - 'JobMatch Scraper/companies.json'
      - 'JobMatch Scraper/templates/**'
      - 'JobMatch Scraper/docs/**'

concurrency:
  # A push that lands while the previous run is still going supersedes it — the older result is
  # about code nobody has any more.
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12          # hard cap so a hung suite cannot drain the Actions budget
    env:
      EV_OFF: '1'                # never write analytics rows from a CI run
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # Pinned to 3.12 for the same reason scrape.yml pins it: python-jobspy 1.1.82 requires
          # numpy==1.26.3, which has no wheels past cp312.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'JobMatch Scraper/requirements-cpanel.txt'

      # feed_parity.py, test_card_meta.py and test_filter_memory.py lift the pure functions out of
      # static/app.js BY SOURCE TEXT and evaluate them in node, so a copy cannot drift from what
      # actually ships. That needs node on PATH.
      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: install
        working-directory: 'JobMatch Scraper'
        run: |
          pip install -r requirements-cpanel.txt
          # PILLOW IS A BUILD DEPENDENCY, NOT A DEPLOYMENT ONE. Only scripts/build_logos.py
          # rasterises anything; the shipped app never imports PIL, so putting it in
          # requirements-cpanel.txt would grow the cPanel bundle an image library it never uses.
          #
          # It has to be here all the same, because test_logos asserts Pillow is present rather
          # than skipping when it is missing -- deliberately, so the pixel-judging gates cannot
          # quietly stop being tested. Without this line that assertion is the only thing that
          # fails in the whole suite, which is exactly what happened once static/** started
          # triggering this workflow.
          pip install pillow

      # test_jd_persist is here for the same reason the others are: it encodes production
      # incidents. It guards the two stores of "we have this description" staying reconciled, the
      # bulk-map key boundary (a one-character URL difference silently discarded 352 fetched
      # descriptions every run), and the thin-JD retry's backoff — including that a backed-off
      # host is NOT probed, which is only assertable because the suite poisons every network path
      # so an attempted fetch is itself the failure. That poisoning is also what makes it CI-safe:
      # verified passing with sockets patched to raise and no credential file present.
      # ONE list, not two. This step used to be three hand-maintained `for` loops naming 36
      # suites, and the app directory contains 43 — test_sponsor_flag.py is offline-safe and had
      # never run here, because it was simply never typed in. The list now lives in SUITES inside
      # scripts/run_tests.py, so adding a suite there adds it to CI and there is nowhere else to
      # forget. The runner still emits ::group:: per suite, so the log is finer-grained than the
      # three steps it replaces, and it sets EV_OFF=1 per subprocess rather than trusting the
      # job-level env to be read before something imports analytics.
      #
      # It also fails a suite that prints FAILED and exits 0. scripts/test_visa.py and
      # scripts/test_notify.py did exactly that until 2026-08-20, so `set -e` here never saw
      # them; both are fixed at the source and the runner keeps watching for the pattern.
      #
      # The parity suites (feed_parity, test_card_meta, test_filter_memory) need node and are in
      # the same list — they are the highest-value gate in the repo, because web.py's
      # _filter_rows and app.js's matches() are deliberate twins and the feed switches between
      # them at 4,000 jobs. Nothing else keeps them in step.
      - name: all offline suites
        working-directory: 'JobMatch Scraper'
        run: python scripts/run_tests.py --ci

      # ANTI-ROT. Same guarantee web-build.yml's `git diff --exit-code -- static/dist` gives the
      # committed React bundle: an artifact that does not match its source is a document nobody
      # reviewed. docs/ARCHITECTURE.md described a Streamlit app reading jobs.csv for three
      # months and nothing noticed, which is the whole reason this step exists.
      #
      # It is stricter than a byte-compare. It also verifies that every symbol docs/INDEX.md
      # names still resolves in the AST, and that every guard command it recommends points at a
      # suite that actually exists in run_tests.py's SUITES. So a rename fails the build naming
      # the offending row, and the index cannot promise a check CI never runs.
      #
      # ~3 seconds, no network, no secrets, safe on a fork PR.
      - name: docs match source
        working-directory: 'JobMatch Scraper'
        run: python scripts/build_docs.py --check
