name: Daily aggregator sweep (sidecar)

# Asks Indeed + LinkedIn + jobright what is being posted, and records it
# in ONE place: the `jobspy_findings` table, plus a spreadsheet artifact per run.
#
# THIS IS A SIDECAR AND MUST STAY ONE. It does not write `jobs`, it does not write `boards`, it
# touches no company table, and it adopts nothing. CLAUDE.md says "don't reach for a job
# aggregator" and this does not reverse that: Adzuna was 6% of the feed and 38% of every job
# with no usable description. The value here is the EMPLOYERS — a company posting that we do not
# scrape is a board worth adopting — and adoption stays the deliberate reviewable step it is
# today (probe_discovered -> adopt_everify_boards).
#
# WHY IT IS SEPARATE FROM scrape.yml, for the same three reasons jobspy-shadow.yml is: the
# production scrape path stays untouched, this cannot take a real scrape down with it, and a
# sweep that gets blocked fails alone.
#
# TIMING. 16:00 UTC = 12:00 noon EDT, which is the slot asked for. GitHub cron is UTC and does
# NOT follow daylight saving, so from early November to mid-March this lands at 11:00 ET. That
# is the same trade scrape.yml already makes (13:00 UTC = 9am ET, 8am under EST); the day is:
#
#   09:00 ET  scrape.yml        heavy pass — verify_dates, analytics rollup, digest email
#   12:00 ET  THIS workflow     aggregator sweep -> jobspy_findings (daily; writes no job rows)
#   13:00 ET  cPanel cron       scrape + new-only score
#   17:00 ET  cPanel cron       scrape + new-only score
#
# BUDGET, AND THE BUDGET IS GONE. This was cut to two Linux jobs a week on 2026-09-10 to stay
# inside the 2,000 free minutes a private repo gets. The repository is PUBLIC, and GitHub bills
# no minutes for Actions on a public repo using standard runners — so the constraint that
# justified the cut does not exist and, checked on 2026-09-19, had already stopped existing.
# Back to daily. The 36-minute job cap stays, because it is a runaway guard rather than a
# budget, and --probe-limit still bounds the only otherwise-unbounded part of the run (one
# careers-site probe per NEW company).
on:
  schedule:
    # DAILY AGAIN, restored 2026-09-19. The Tuesday/Thursday cut was made on 2026-09-10 for
    # one reason and one only — September stood at 939 of 2,000 free minutes on day 10 and the
    # remaining schedule projected past the cap around the 22nd, and when a PRIVATE repo caps,
    # every workflow stops: the scrape, the watchdog and CI, not just this one.
    #
    # That reasoning was sound and its premise is not: this repository is public, so these runs
    # are not metered at all. The cut was costing five sweeps a week to protect an allowance
    # that was not being spent. Seven days a week is what it ran before, weekend included.
    #
    # If this ever needs cutting again, it is still the right thing to cut FIRST — it is the
    # only scheduled job whose output nothing depends on: it writes no job rows, adopts no
    # boards, and its deliverable is a list of employers to review.
    - cron: "0 16 * * *"        # 12:00 noon EDT daily (11:00 ET once EST starts)
  workflow_dispatch:
    inputs:
      sites:
        description: "JobSpy sites (comma-separated)"
        required: true
        default: "indeed,linkedin"
      phrases:
        description: "'entry', 'all', or pipe-separated phrases"
        required: true
        default: "entry"
      hours:
        description: "posting age window"
        required: true
        default: "24"
      budget_min:
        description: "network budget in minutes (up to 20)"
        default: "20"
      jobright:
        description: "also try jobright (usually Cloudflare-blocked from a runner)"
        type: boolean
        default: true
      apply:
        description: "write to the jobspy_findings table"
        type: boolean
        default: true

defaults:
  run:
    working-directory: JobMatch Scraper

permissions:
  contents: read

concurrency:
  # A sweep that overruns must not have a second one writing the same rows underneath it.
  group: jobspy-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest        # Linux = 1x minute billing, same as the scrape job
    # 30 -> 36, to stay above the step cap below plus install and artifact upload. A job cap
    # that sits only 4 minutes above its longest step turns a slow pip resolve into a second,
    # differently-worded timeout.
    timeout-minutes: 36
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # Must match scrape.yml and jobspy-shadow.yml. python-jobspy 1.1.82 pins
          # numpy==1.26.3 EXACTLY and that numpy has no wheels past cp312, so a newer
          # interpreter tries to build it from source and fails.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "JobMatch Scraper/requirements.txt"

      - name: Install dependencies
        timeout-minutes: 8
        run: |
          pip install -r requirements.txt
          pip install openpyxl        # the .xlsx report; requirements.txt only suggests it

      - name: Sweep
        # 20 -> 26. THE 20 WAS UNDER THE MEASURED COST OF THE SCHEDULED CONFIGURATION, so the
        # schedule could not pass: 2026-09-07, -09 and -10 all died on this cap at 20m44s-20m53s
        # of wall clock, and the only run that ever went green was a manual `indeed`-only one
        # that finished in 19m27s -- 33 seconds of slack. The schedule runs indeed AND linkedin
        # AND jobright, which is strictly more work than the one configuration that fit.
        #
        # This costs almost nothing to raise, which is the point: a timed-out run already burns
        # the full 20 minutes and then throws away every harvested row, because the sweep writes
        # the ledger once at the end. The choice is 20 wasted minutes or ~22 useful ones.
        #
        # BUDGET, because it is tight: this account is at ~1,709 of 2,000 free minutes a month
        # (measured 2026-09-10 over the preceding 30 days), and `Scrape jobs` is 1,331 of that.
        # If the cap is ever reached, cut the CADENCE of this sidecar -- it writes no job rows
        # and adopts nothing -- before touching the scrape.
        timeout-minutes: 26
        env:
          DB_PROXY_URL: ${{ secrets.DB_PROXY_URL }}
          DB_PROXY_SECRET: ${{ secrets.DB_PROXY_SECRET }}
          DB_REQUIRE: proxy
          # Inputs go through the environment, never interpolated into the script body: a
          # ${{ }} expansion is substituted as raw text BEFORE the shell parses the line, so a
          # phrase containing a quote or semicolon would execute. Read as "$VAR" it is only
          # ever data. Same mitigation as jobspy-shadow.yml.
          IN_SITES: ${{ inputs.sites || 'indeed,linkedin' }}
          IN_PHRASES: ${{ inputs.phrases || 'entry' }}
          # 120 -> 48, because the cadence above changed back underneath it. 120 was sized to
          # span Thursday-to-Tuesday when this ran twice a week; on a daily schedule the only
          # gap left to cover is a single missed run, which is 48 hours.
          #
          # NARROWING IT IS THE POINT, not a saving. Measured 2026-09-14: a sweep widened to
          # --hours 720 banked 1,599 rows of which only 435 urls were brand new — a wide window
          # mostly RE-STAMPS rows already in the ledger, and because `url` is the primary key a
          # re-seen posting overwrites rather than adds. That is what makes a run's row count
          # shrink after the next one and what pushes already-reviewed employers back up the
          # ranking. A manual run keeps the 24-hour default declared above: that path is for
          # smoke-testing, where a tight window is the point.
          IN_HOURS: ${{ inputs.hours || '48' }}
          IN_BUDGET_MIN: ${{ inputs.budget_min || '20' }}
          # On by default on the SCHEDULE, same shape as IN_APPLY below. Expect it to
          # contribute ~nothing from here: jobright sits behind Cloudflare and answers a
          # datacenter IP with a 200 carrying a challenge page, which the sweep reports
          # as "returned nothing" and treats as normal. It is wired because it costs one
          # cheap failure per role and pays off the day that changes; the route that
          # actually reads jobright is a laptop run.
          IN_JOBRIGHT: ${{ (github.event_name == 'schedule' || inputs.jobright) && '--jobright' || '' }}
          # Defaults to writing on the SCHEDULE (inputs are empty there), which is the point of
          # the job; a manual run can turn it off.
          IN_APPLY: ${{ (github.event_name == 'schedule' || inputs.apply) && '--apply' || '' }}
        run: |
          set -euo pipefail
          echo "Runner egress IP (datacenter reputation decides what answers us):"
          curl -s --max-time 10 https://api.ipify.org || echo "(lookup failed, not fatal)"
          echo
          python -u scripts/jobspy_sweep.py \
            --sites "$IN_SITES" \
            --phrases "$IN_PHRASES" \
            --hours "$IN_HOURS" \
            --results 50 \
            --probe-limit 60 \
            --budget-min "$IN_BUDGET_MIN" --query-timeout 90 \
            --out "jobspy_findings_$(date -u +%F).xlsx" \
            $IN_JOBRIGHT $IN_APPLY -v 2>&1 | tee sweep-report.txt

      - name: Upload the findings spreadsheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobspy-findings
          # Retained longer than a debug artifact because this IS the deliverable: the
          # spreadsheet is what gets reviewed to decide which boards to adopt.
          retention-days: 90
          if-no-files-found: warn
          path: |
            JobMatch Scraper/jobspy_findings_*.xlsx
            JobMatch Scraper/jobspy_findings_*.csv
            JobMatch Scraper/sweep-report.txt
