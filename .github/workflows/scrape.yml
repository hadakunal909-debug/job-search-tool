name: Scrape jobs

# Runs the scraper on a schedule and writes results to Supabase.
# NOTE: the app lives in the "JobMatch Scraper/" subfolder (the repo root holds
# sibling projects), so every run step works from that directory. This file must
# stay at the repo root — GitHub only reads workflows from /.github/workflows/.
#
# SCHEDULE: 3 feed updates a day (~9am, 1pm, 5pm ET). GitHub cron is UTC and does
# NOT track DST, so the three fixed UTC times below land ~1h earlier in winter (EST)
# than in summer (EDT) — fine for a job feed. Cron fires exactly 3x/day (no gated
# no-op runs), which keeps us comfortably inside the free 2,000 Actions-minutes/month.
# The heavy score/verify/email pass runs once a day (the morning run); manual dispatch
# always does the full pass.
on:
  schedule:
    - cron: "0 13,17,21 * * *"   # 3x/day: ~9am,1pm,5pm ET (EDT); ~1h earlier under EST
  workflow_dispatch: {}             # on-demand (Actions tab + the app's "Update jobs" button)

defaults:
  run:
    working-directory: JobMatch Scraper

jobs:
  scrape:
    runs-on: ubuntu-latest          # Linux = 1x minute billing (Windows is 2x, macOS 10x)
    timeout-minutes: 45             # hard cap so a stuck run can never silently drain the budget
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip                                        # reuse the pip download cache
          cache-dependency-path: "JobMatch Scraper/requirements.txt"

      - name: Decide whether this run does the heavy pass
        id: gate
        run: |
          H=$(TZ=America/New_York date +%-H)          # current Eastern hour, no leading zero
          RUN=yes; HEAVY=no
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$H" -le 9 ]; then HEAVY=yes; fi      # the morning run does the once-a-day heavy pass
          else
            HEAVY=yes                                   # manual / app-button run: full pass
          fi
          echo "run=$RUN"     >> "$GITHUB_OUTPUT"
          echo "heavy=$HEAVY" >> "$GITHUB_OUTPUT"
          echo "ET hour=$H  event=${{ github.event_name }}  ->  run=$RUN heavy=$HEAVY"

      - name: Install dependencies
        if: steps.gate.outputs.run == 'yes'
        run: pip install -r requirements.txt

      - name: Scrape new jobs into Supabase
        if: steps.gate.outputs.run == 'yes'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}    # aggregator boards (Tesla/Google/
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}  # IBM/...) stay dormant without these
        run: python -m scraper

      - name: Score + verify dates + alerts (once a day / on manual run)
        if: steps.gate.outputs.run == 'yes' && steps.gate.outputs.heavy == 'yes'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}    # for the JD backfill on Adzuna ads
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          # Safety valve: fetch at most this many missing JDs per run so the pass always
          # finishes inside the timeout. JDs persist incrementally, so a large backlog just
          # drains over a few days instead of a timed-out run banking nothing.
          SCORE_MAX_FETCH: "3000"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          ALERT_MIN_SCORE: ${{ secrets.ALERT_MIN_SCORE }}
        run: |
          python -m scraper.score_jobs
          python -m scraper.verify_dates --workers 24   # real posting dates -> posted_verified
          python -m scraper.notify
