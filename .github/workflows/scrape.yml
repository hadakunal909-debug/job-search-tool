name: Scrape jobs

# Runs the scraper + scorer on a schedule and writes results to Supabase.
# NOTE: the app lives in the "JobMatch Scraper/" subfolder (the repo root holds
# sibling projects), so every run step works from that directory. This file must
# stay at the repo root — GitHub only reads workflows from /.github/workflows/.
on:
  schedule:
    - cron: "0 13 * * *"      # daily at 13:00 UTC (~8am ET). Times are UTC.
  workflow_dispatch: {}        # also run on demand from the Actions tab

defaults:
  run:
    working-directory: JobMatch Scraper

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape and score into Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}    # aggregator boards (Tesla/Google/
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}  # IBM/...) stay dormant without these
        run: |
          python -m scraper
          python -m scraper.score_jobs

      - name: Email new-job alerts (dormant unless SMTP_* secrets are set)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          ALERT_MIN_SCORE: ${{ secrets.ALERT_MIN_SCORE }}
        run: python -m scraper.notify
