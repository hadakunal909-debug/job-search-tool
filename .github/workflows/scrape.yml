name: Scrape jobs

# Runs the scraper on a schedule and writes results to Supabase.
# NOTE: the app lives in the "JobMatch Scraper/" subfolder (the repo root holds
# sibling projects), so every run step works from that directory. This file must
# stay at the repo root — GitHub only reads workflows from /.github/workflows/.
#
# SCHEDULE: 2 feed updates per WEEKDAY — 10am and 2pm ET — and nothing on Sat/Sun.
# That's 2 x ~22 = ~44 scheduled runs a month, down from the previous 3-a-day-every-day
# (~90), so it sits well inside the free 2,000 Actions-minutes/month.
#
# GitHub cron is UTC and does NOT track DST, so these two fixed UTC times are exactly
# 10am/2pm ET during EDT (Mar-Nov) and land an hour earlier — 9am/1pm ET — under EST.
# Accepted drift: a job feed does not care, and the alternative (extra cron entries at
# 15/19 UTC gated by the Eastern hour) burns billed minutes on no-op runs to buy an hour.
# Both times stay on the same UTC calendar day as the ET day, so 1-5 really is Mon-Fri
# either side of the DST switch — no run leaks onto Saturday or Sunday.
#
# Day-of-week is written 1-5 rather than MON-FRI purely because the numeric form is
# unambiguous in every cron parser. Sunday is 0.
#
# The heavy score/verify/email pass runs on the morning run each weekday, PLUS the Friday
# afternoon run so a Friday PM batch is scored and emailed before the weekend instead of
# waiting until Monday. That's ~26 heavy passes a month. The gate step below decides, keyed
# off the Eastern hour and weekday rather than the cron line. Manual dispatch always does
# the full pass. Nothing at all runs Sat/Sun, so the digest is weekdays only.
on:
  schedule:
    - cron: "0 14 * * 1-5"      # 10am ET Mon-Fri (9am under EST) — the heavy pass runs here
    - cron: "0 18 * * 1-5"      #  2pm ET Mon-Fri (1pm under EST) — feed refresh only
  workflow_dispatch: {}             # on-demand (Actions tab + the app's "Update jobs" button)

defaults:
  run:
    working-directory: JobMatch Scraper

jobs:
  scrape:
    runs-on: ubuntu-latest          # Linux = 1x minute billing (Windows is 2x, macOS 10x)
    timeout-minutes: 45             # hard cap so a stuck run can never silently drain the budget
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip                                        # reuse the pip download cache
          cache-dependency-path: "JobMatch Scraper/requirements.txt"

      - name: Decide whether this run does the heavy pass
        id: gate
        run: |
          H=$(TZ=America/New_York date +%-H)          # current Eastern hour, no leading zero
          D=$(TZ=America/New_York date +%u)           # Eastern day of week, 1=Mon .. 7=Sun
          RUN=yes; HEAVY=no
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # "Before noon Eastern" == the morning run, which does the once-a-day heavy pass.
            # Deliberately a noon boundary rather than an exact hour: the 14:00 UTC cron lands
            # at 10am ET under EDT and 9am under EST, and the 18:00 UTC one at 2pm/1pm, so this
            # test picks the right run of the day without caring which side of DST we are on.
            if [ "$H" -lt 12 ]; then HEAVY=yes; fi
            # ...plus Friday afternoon. There is no weekend run, so without this anything the
            # Friday PM scrape finds sits unscored — score_pending on the card, invisible to the
            # match filter, and absent from the digest — until Monday morning. One extra heavy
            # pass a week buys a scored, emailed Friday batch.
            if [ "$D" = "5" ] && [ "$H" -ge 12 ]; then HEAVY=yes; fi
          else
            HEAVY=yes                                   # manual / app-button run: full pass
          fi
          echo "run=$RUN"     >> "$GITHUB_OUTPUT"
          echo "heavy=$HEAVY" >> "$GITHUB_OUTPUT"
          echo "ET $(TZ=America/New_York date '+%a %H:%M') (dow=$D hour=$H)  event=${{ github.event_name }}  ->  run=$RUN heavy=$HEAVY"

      - name: Install dependencies
        if: steps.gate.outputs.run == 'yes'
        run: pip install -r requirements.txt

      - name: Scrape new jobs into Supabase
        if: steps.gate.outputs.run == 'yes'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}    # aggregator boards (Tesla/Google/
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}  # IBM/...) stay dormant without these
          # FRESHNESS POLICY — keep only roughly the last month of postings.
          # A posting that has been up 30+ days is almost always filled, and on the Supabase
          # free tier every dead row costs space and slows the feed. MAX_AGE_DAYS refuses them
          # on the way in; PRUNE_DAYS removes ones already stored. Both are stated here rather
          # than left to the code defaults so the policy is visible in the run log.
          MAX_AGE_DAYS: "30"
          PRUNE_DAYS: "30"
          # AUTO-DISCOVERY. Probe this many not-yet-scraped employers from migratemate.co's
          # public sponsor directory each run and save any with a readable ATS board, so the
          # board list keeps growing without a code change. ~0.7 companies/sec, so 60 costs
          # ~90s — negligible against the scrape, and it compounds every weekday. The window
          # rotates by day-of-year, which is what makes it work on a stateless runner.
          DISCOVER_LIMIT: "60"
        run: python -m scraper

      - name: Score + verify dates + alerts (once a day / on manual run)
        if: steps.gate.outputs.run == 'yes' && steps.gate.outputs.heavy == 'yes'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}    # for the JD backfill on Adzuna ads
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          # Safety valve: fetch at most this many missing JDs per run so the pass always
          # finishes inside the timeout. JDs persist incrementally, so a large backlog just
          # drains over a few days instead of a timed-out run banking nothing.
          SCORE_MAX_FETCH: "3000"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          ALERT_MIN_SCORE: ${{ secrets.ALERT_MIN_SCORE }}
        run: |
          python -m scraper.score_jobs
          python -m scraper.verify_dates --workers 24   # real posting dates -> posted_verified
          python -m scraper.notify
