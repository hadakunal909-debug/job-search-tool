name: Scrape jobs

# Runs the scraper on a schedule and writes results to the cPanel Postgres behind
# stemjobs1.astrochakra.co, via the /api/db HMAC proxy (DB_PROXY_*). It wrote to Supabase
# until 2026-08-15; DB_REQUIRE=proxy below now makes a run that would silently revert to
# Supabase fail instead.
# NOTE: the app lives in the "JobMatch Scraper/" subfolder (the repo root holds
# sibling projects), so every run step works from that directory. This file must
# stay at the repo root — GitHub only reads workflows from /.github/workflows/.
#
# SCHEDULE: EVERY 3 HOURS, EVERY DAY — eight runs a day, and exactly ONE of them is heavy.
# Changed 2026-09-19, and what made it affordable is that this repository is PUBLIC: GitHub
# bills no minutes for Actions on a public repo using standard runners, so the 2,000-minute
# free allowance this file spent three months rationing no longer applies. The cost note on
# timeout-minutes below is kept as history, not as a live constraint.
#
# WHAT IS NOT FREE is other people's servers. Eight sweeps a day is 5.6x the outbound volume
# the two-a-weekday schedule put on employers' ATS hosts, and bot-walling — not billing — is
# now the binding constraint. If boards start failing in numbers the lever is this cron line,
# and the measurement that justifies pulling it is the board-health block the sweep prints
# (20 failed / 27 silent of 3,247 boards on 2026-09-19, the day before this change).
#
# THE CPANEL CRON STILL SWEEPS AT 13:00 AND 16:00 ET and now duplicates this workflow.
# Retiring those two lines is a change to the box's crontab, which lives nowhere in this repo
# — see bin/cron_scrape.sh's header. The hourly --analyze-only line should STAY: it does not
# scrape, it writes jd_terms, and it is what keeps a card from reading "Not scored".
#
# GitHub cron is UTC and does NOT track DST, so these two fixed UTC times are exactly
# 12pm/4pm ET during EDT (Mar-Nov) and land an hour earlier — 11am/3pm ET — under EST.
# Accepted drift: a job feed does not care, and the alternative (extra cron entries gated
# by the Eastern hour) burns billed minutes on no-op runs to buy back that hour.
# Both times stay on the same UTC calendar day as the ET day, so 1-5 really is Mon-Fri
# either side of the DST switch — no run leaks onto Saturday or Sunday.
#
# Day-of-week is written 1-5 rather than MON-FRI purely because the numeric form is
# unambiguous in every cron parser. Sunday is 0.
#
# HEAVY vs LIGHT, because eight identical runs would mean eight digest emails a day. The
# gate step below gives HEAVY to the FIRST run of each Eastern day and to every manual
# dispatch; the other seven are light. Heavy is unchanged from what the single daily run did:
# JobSpy, the full-corpus re-score, verify_dates, close_dead_jds, the facts rebuild and the
# ONE digest email. Light is sweep + new-only scoring + score_users — the same work
# bin/cron_scrape.sh does on the box.
#
# (Scoring is NOT part of that split — it runs on every pass, because an unscored job is
# invisible to the match filter. The light runs just score in cheap new-only mode.)
on:
  schedule:
    # ONE run a day now, not two. The database moved to cPanel and a cron on that box covers the
    # other two slots, so the day is split three ways rather than both halves landing here:
    #
    #   09:00 ET  THIS workflow      heavy pass — verify_dates, analytics rollup, digest email
    #   13:00 ET  cPanel cron        scrape + new-only score
    #   16:00 ET  cPanel cron        scrape + new-only score
    #
    # All three slots are Mon-Fri. THE CPANEL SLOTS LIVE IN THREE PLACES -- this table, the
    # header of bin/cron_scrape.sh, and the box's actual crontab -- and only the crontab is
    # load-bearing. `ssh <box> crontab -l` reads it; an earlier version of this comment said the
    # schedule "existed nowhere but that web form", which sent everyone to a cPanel web page for
    # a value SSH will print.
    #
    # That mattered on 2026-08-20, when 562b63f moved the second slot 17:00 -> 16:00 ET here and
    # in cron_scrape.sh but not in the crontab, which kept firing at 17:00 ET until 2026-08-25.
    # For five days the schedule this file described was not the schedule that ran.
    #
    # Actions keeps the 9am slot deliberately: it is the pass that emails the digest and runs
    # verify_dates against a rate-limited service, and a GitHub runner is a whole machine for
    # 45 minutes, whereas the cPanel box has to serve the website at the same time.
    # 12:47 UTC, not 13:00. GitHub queues every cron in the world at the top of the hour and
    # drains it as capacity appears, so :00 is the single most congested minute there is and the
    # delay lands on us. MEASURED on this repo, first fire after the 13:00 slot:
    #
    #   Aug 24-26   13:43  13:42  13:48      +43 to +48 min
    #   Aug 27-28   22:42  22:49              +9h42, +9h49
    #   Aug 31      19:19                     +6h19
    #   Sep 1-3     17:05  16:56  16:48       +4h05, +3h56, +3h48
    #   Sep 4       never fired at all
    #
    # So "9am" has not meant 9am for over a week, and on 2026-09-04 the event was dropped
    # outright — while push-triggered runs on the same repo that morning started normally, which
    # rules out a disabled workflow or an exhausted minute allowance and leaves scheduled-event
    # delivery itself. Moving to :47 buys back the top-of-hour queue and puts a typically
    # delayed run at roughly 9:00-9:15 ET instead of 9:45.
    #
    # It does NOT make the schedule reliable, because nothing here can. scrape-watchdog.yml is
    # what guarantees the run happens: it checks whether today's scrape landed and fires a
    # workflow_dispatch if it did not, and dispatch is delivered immediately rather than queued
    # with the world's crons. This line is now the fast path, not the guarantee.
    # :47 rather than :00, and that stays load-bearing at this cadence. The top of the hour
    # is when the world's crons queue; the drift table above was measured against an on-the-
    # hour line and reached +9h42. Every third hour, off the hour, is the fast path.
    - cron: "47 */3 * * *"      # every 3 hours, every day — the gate picks which is heavy
  workflow_dispatch: {}             # on-demand (Actions tab + the app's "Update jobs" button)

# ONE SCRAPE AT A TIME. There was no guard here at all until 2026-09-19, which was safe only
# because the schedule fired once a day against a job capped at 180 minutes. At a 3-hour
# cadence those two numbers touch: a run that uses its full cap is still sweeping when the
# next one starts, and two concurrent sweeps would hit the same 3,225 boards and upsert the
# same URLs.
#
# cancel-in-progress is FALSE deliberately. Cancelling a running sweep to start a fresh one
# throws away work already banked slice by slice; queueing costs nothing now that minutes are
# free. A queued run is not a wasted one either — when it starts, the gate below sees a
# scrape that succeeded inside the last 150 minutes and no-ops it in seconds.
concurrency:
  group: scrape-jobs
  cancel-in-progress: false

defaults:
  run:
    working-directory: JobMatch Scraper

jobs:
  scrape:
    runs-on: ubuntu-latest          # Linux = 1x minute billing (Windows is 2x, macOS 10x)

    # Stated rather than inherited. The gate step below calls `gh run list` to find out whether
    # today's scrape already succeeded, which needs actions:read — and if the repository default
    # is ever tightened to contents-only, an unstated permission turns that query into a silent
    # `|| echo 0`, i.e. the duplicate-suppression quietly stops working and nothing says so.
    permissions:
      contents: read                # actions/checkout
      actions: read                 # gh run list, in the gate
    # 45 -> 58. MEASURED, and the job cap was the real ceiling, not the step's. On 2026-08-20 the
    # whole job ran 40.5 min of 45: scrape 19.5 + score 11.7 + verify 8.4. So raising the scrape
    # step alone would just move the kill from the step to the job.
    #
    # COST, stated rather than hidden: one scheduled run a weekday, so the worst case is
    # 58 x 22 = ~1,276 of the 2,000 free Actions minutes a month, and python-tests runs on top of
    # that. This is a CEILING, not a spend -- a healthy run still finishes in ~40 -- but if the
    # bill gets close, the lever is the number of boards swept, not this line.
    # 58 -> 90. Raised with the scrape step (32 -> 55) for the bigger board list.
    # The job cap exists so a runaway step cannot burn a whole hour of Actions time;
    # it is deliberately well above the sum of the steps that actually run, because a
    # job-level kill loses the steps that had not started and says nothing about which
    # one misbehaved -- the per-step caps are what diagnose that.
    #
    # COST -- READ THIS BEFORE ASSUMING THE SCHEDULE STILL FITS. Twice a day, ~44 runs
    # a month. At ~35 min a run that was ~1,500 minutes; at the ~55 min an unbounded
    # sweep of 1,797 boards is expected to take it is ~2,400. The free allowance for a
    # private repo is 2,000/month, and this schedule was ALREADY cut from hourly to
    # twice daily when that cap was hit once before.
    #
    # So the sweep is now unbounded by explicit choice -- completeness over cost --
    # and the thing to watch is the Actions bill, not the STARVED count, which should
    # now always be zero. If the allowance runs out the options in order are: cap the
    # per-board Workday straggler, drop to one run a day, or make the repo public.
    # Re-tightening SCRAPE_BUDGET_MIN is the one that does not work -- measured.
    timeout-minutes: 180

    # WHERE THE DATABASE IS. Set at JOB level rather than repeated across the five steps below,
    # because unlike SUPABASE_* — which some steps genuinely don't need — this pair decides the
    # transport for every one of them and must never differ between two steps of the same run.
    #
    # db.py picks its transport in this order: PG_DSN (a local Postgres), then DB_PROXY_* (this
    # pair), then Supabase, then jobs.csv. THE MIGRATION THIS COMMENT USED TO DESCRIBE AS PENDING
    # IS DONE — it happened on 2026-08-15 and the app reads the cPanel Postgres now.
    #
    # That completion inverted the safety of the fallback, which is why DB_REQUIRE is below.
    # While Supabase was live, an empty secret harmlessly left the scraper where it already was.
    # Afterwards, the identical fallback means "write 26 minutes of jobs into a database nobody
    # reads, and report success" — and it is not hypothetical: DB_PROXY_URL set with an empty
    # DB_PROXY_SECRET resolves to "Supabase", measured 2026-08-19.
    #
    # The direction to fail is still the same one the original note argued for: the sweep is
    # stateless and re-scrapes from the boards next run, so a failed run costs a cycle and loses
    # nothing. A silently stale feed is neither cheap nor visible.
    env:
      DB_PROXY_URL: ${{ secrets.DB_PROXY_URL }}
      DB_PROXY_SECRET: ${{ secrets.DB_PROXY_SECRET }}
      # STATE THE BACKEND, so a misconfigured run dies in one second instead of writing 26
      # minutes of work somewhere harmless-looking. Everything above describes DB_PROXY_* as safe
      # to add because an empty secret just leaves the scraper on Supabase — which was true while
      # Supabase was still the live database. It stopped being true on 2026-08-15, and from then
      # on the same fallback meant "silently write to a database the app no longer reads".
      # Measured 2026-08-19: DB_PROXY_URL set with an empty DB_PROXY_SECRET resolves to
      # "Supabase" and reports success. db._check_backend_intent now refuses that.
      DB_REQUIRE: proxy
      # THE AGGREGATOR SWEEP, and it lives here rather than in bin/cron_scrape.sh for a reason
      # that is not preference: the cPanel virtualenv is Python 3.9.23 and python-jobspy has no
      # distribution for it ("No matching distribution found"), so setting this there would set
      # an env var the library can never honour. The import is guarded, so it would not crash --
      # it would print "python-jobspy not installed; jobspy boards skipped" five times a run and
      # look enabled while doing nothing. This runner is 3.12 and requirements.txt already pins
      # the library, installed-but-dormant, waiting for exactly this variable.
      #
      # INDEED ONLY. scripts/jobspy_shadow.py, 2026-09-05, 5 phrases x 25 results:
      #
      #   site            rows  direct  net-new  net/returned   time
      #   indeed           115    94%       79      68.7%       10.8s
      #   linkedin         125     0%      111      88.8%       62.9s
      #   glassdoor          0     --        0        --
      #   zip_recruiter      0     --        0        --
      #
      # LinkedIn is excluded despite the higher net-new: 0% direct means every row is stored
      # under a linkedin.com url instead of the employer's own ATS link, and it returns no
      # description at all. An aggregator url with no JD is what made Adzuna 38% of the entire
      # JD backlog from 6% of the jobs -- see the removal note above SOURCES. Glassdoor and
      # ZipRecruiter return zero upstream (JobSpy issue #302).
      #
      # One slot a day, not three: this is the only scrape path that CAN run it, and an
      # aggregator does not need the cadence an employer board does.
      JOBSPY_SITES: indeed

    steps:
      # v5/v6 rather than v4/v5: the older majors ship a Node 20 entrypoint, which the
      # runners now force onto Node 24 with a deprecation warning and will eventually stop
      # running at all. These majors target Node 24 natively; nothing else about them changed.
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip                                        # reuse the pip download cache
          cache-dependency-path: "JobMatch Scraper/requirements.txt"

      - name: Decide whether this run does the heavy pass
        id: gate
        run: |
          H=$(TZ=America/New_York date +%-H)          # current Eastern hour, no leading zero
          D=$(TZ=America/New_York date +%u)           # Eastern day of week, 1=Mon .. 7=Sun
          # A SECOND SLOT WAS ADDED BACK — seven of them — so this is the "real decision"
          # the previous comment here asked for, made on 2026-09-19.
          #
          # The default is now LIGHT, and heavy is earned by being first. Defaulting the other
          # way is the version that mails eight digests a day: `heavy` gates notify, JobSpy,
          # verify_dates, close_dead_jds and the facts rebuild, and not one of those is a cost
          # that divides by eight.
          #
          # A manual dispatch is still always heavy — see the else branch below.
          RUN=yes; HEAVY=no

          # ...with ONE real branch, and it is load-bearing rather than decorative.
          #
          # scrape-watchdog.yml dispatches this workflow when the 12:47 cron does not deliver.
          # GitHub does not cancel the dropped event, it delivers it late — up to nine hours late
          # on this repo in August — so the watchdog's run and the belated scheduled one can both
          # land on the same day. That is 40 wasted minutes of a metered allowance and a second
          # digest email into the same inbox.
          #
          # ONLY `schedule` is gated. A workflow_dispatch is somebody (or the app's "Update jobs"
          # button) asking for a scrape right now, and an explicit request must never be answered
          # with silence — the watchdog does its own has-it-run-today check before dispatching,
          # so gating dispatch here would just duplicate that in the place where it is wrong.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Two date calls for the reason scrape-watchdog.yml spells out: -u sets the
            # zone for parsing too, so the one-call form silently reads Eastern midnight
            # as UTC midnight and starts the window four hours early.
            ET_MIDNIGHT=$(TZ=America/New_York date +%Y-%m-%dT00:00:00%:z)
            SINCE=$(date -u -d "$ET_MIDNIGHT" +%Y-%m-%dT%H:%M:%SZ)
            DONE=$(gh run list --workflow=scrape.yml --limit 50 \
                     --json createdAt,conclusion,databaseId \
                     --jq "[.[] | select(.createdAt >= \"$SINCE\")
                                | select(.conclusion == \"success\")
                                | select(.databaseId != ${{ github.run_id }})] | length" 2>/dev/null || echo 0)
            # RECENT, and this is what replaced "has one succeeded TODAY". That test was right
            # for a once-a-day cron and is fatal to this one: after the day's first run succeeds
            # it would no-op all seven that follow — not a schedule change so much as a way of
            # keeping the old schedule while appearing to change it.
            #
            # What the old test was FOR survives here. GitHub delivers a dropped cron late
            # rather than cancelling it (up to +9h42 on this repo), so a stale event can land
            # beside a fresh run. 150 minutes suppresses exactly that, and cannot suppress a
            # legitimate fire, because those are 180 minutes apart.
            RECENT_SINCE=$(date -u -d '150 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
            RECENT=$(gh run list --workflow=scrape.yml --limit 50 \
                     --json createdAt,conclusion,databaseId \
                     --jq "[.[] | select(.createdAt >= \"$RECENT_SINCE\")
                                | select(.conclusion == \"success\")
                                | select(.databaseId != ${{ github.run_id }})] | length" 2>/dev/null || echo 0)
            if [ "${RECENT:-0}" -gt 0 ]; then
              RUN=no
              echo "::notice::A scrape already succeeded in the last 150 min ($RECENT run(s) since $RECENT_SINCE). This fire is a no-op."
            elif [ "${DONE:-0}" = 0 ]; then
              # Nothing has succeeded since Eastern midnight, so this is the day's first run
              # and it carries the heavy pass — including the single digest email.
              HEAVY=yes
              echo "::notice::First run of the ET day — taking the heavy pass."
            fi
          else
            # workflow_dispatch: a person, the app's "Update jobs" button, or
            # scrape-watchdog.yml. An explicit request gets the full pass, unchanged.
            HEAVY=yes
          fi

          echo "run=$RUN"     >> "$GITHUB_OUTPUT"
          echo "heavy=$HEAVY" >> "$GITHUB_OUTPUT"
          echo "ET $(TZ=America/New_York date '+%a %H:%M') (dow=$D hour=$H)  event=${{ github.event_name }}  ->  run=$RUN heavy=$HEAVY"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install dependencies
        if: steps.gate.outputs.run == 'yes'
        timeout-minutes: 6
        run: pip install -r requirements.txt

      # SAY WHERE THE WRITES ARE GOING, before spending any budget. Every step below reports its
      # backend only in its closing summary, so a run that wrote to the wrong database looked
      # identical to a good one until you read the tail of a 26-minute log — and a 401 from a bad
      # secret is invisible here entirely, since it surfaces per request further down.
      #
      # This is one HTTP round trip and it answers the only question that matters first: is this
      # run pointed at the database the app actually reads? DB_REQUIRE=proxy above makes db.py
      # raise rather than fall back, so this step is where that surfaces.
      # resume.txt IS NOT IN THE REPOSITORY ANY MORE. It was removed from the tree and purged
      # from history on 2026-09-19, when this repo went public: it is a real resume carrying a
      # real name, phone number and email, and a public repo makes those permanently
      # searchable. The scrape needs its TEXT, not a tracked file, so it arrives as a secret
      # and is written here. The deploy zip and the cPanel box keep their own local copy.
      #
      # THIS STEP FAILS THE RUN WHEN THE SECRET IS EMPTY, deliberately and loudly, because
      # score_jobs does the opposite: "No resume.txt found — scores would all be 0. Aborting."
      # (score_jobs.py:1889) and then EXITS 0. A run with no resume therefore reports SUCCESS
      # while scoring nothing at all — the whole intake lands with a NULL match_score and is
      # invisible to the feed's filter. An unset secret has to break the build, not the feed.
      - name: Materialise resume.txt from the RESUME_TXT secret
        if: steps.gate.outputs.run == 'yes'
        timeout-minutes: 2
        env:
          RESUME_TXT: ${{ secrets.RESUME_TXT }}
        run: |
          if [ -z "$RESUME_TXT" ]; then
            echo "::error::RESUME_TXT secret is unset or empty. Scoring would silently write zeros, so this run is refusing to continue. Set it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          printf '%s' "$RESUME_TXT" > resume.txt
          echo "resume.txt written: $(wc -c < resume.txt) bytes, $(wc -l < resume.txt) lines."

      - name: Preflight — confirm the database
        id: preflight
        if: steps.gate.outputs.run == 'yes'
        timeout-minutes: 2
        run: |
          python - <<'PY'
          import db
          print("backend:", db.backend_name())
          n = len(db.load_jobs(include_jd=False, cols="url") or [])
          print("reachable: %d row(s) already stored" % n)
          if n == 0:
              raise SystemExit("connected but the corpus is EMPTY — that is a fresh or wrong "
                               "database, not the live one. Refusing to scrape into it.")
          PY

      # The stored job DESCRIPTIONS, carried between runs.
      #
      # The heavy pass has to have every JD (it builds IDF over the whole corpus and re-analyzes
      # every row), but a stored JD never changes — the scheduled pass only fetches rows that
      # have none. Re-downloading all ~16k of them from Supabase daily measured ~128 MB and was
      # the single largest item on the free-tier egress bill. With this cache a run pulls only
      # the descriptions added since the last one.
      #
      # The key must be unique per run or the save is a no-op (cache entries are immutable), so
      # this is the standard rolling-key + restore-keys prefix pattern. A miss is safe:
      # score_jobs falls back to one full read and repopulates. ~40 MB against a 10 GB repo
      # allowance, touched daily so it never hits the 7-day eviction window.
      - name: Restore the JD corpus cache
        if: steps.gate.outputs.run == 'yes'
        # v6, not v4. checkout and setup-python were moved off their Node 20 entrypoints when
        # the runners started forcing those onto Node 24; this one was missed, so every run
        # since has carried a deprecation annotation for it — which is noise on a green run and
        # camouflage on a red one, where it sat directly above the real errors on 2026-09-03.
        # Nothing about the cache's behaviour or key format changes between these majors.
        uses: actions/cache@v6
        with:
          path: JobMatch Scraper/jd_cache.json.gz
          key: jd-corpus-${{ github.run_id }}
          restore-keys: |
            jd-corpus-

      # Every step below carries its OWN timeout-minutes as well as a budget passed to the
      # script. The job-level cap alone was not enough: when a step overran, the runner
      # killed the whole JOB, so the log said only "exceeded the maximum execution time"
      # with no indication of which step was responsible, and — worse — the steps that had
      # not run yet were simply lost. A per-step cap fails the step that actually misbehaved
      # and lets the rest of the pipeline continue.
      # Named for the ACTION, not the destination. It said "into Supabase", which stopped
      # being true on 2026-08-15 and is exactly the kind of stale label that makes a
      # wrong-database run look normal. The preflight above prints where it really goes.
      - name: Scrape new jobs
        id: scrape
        if: steps.gate.outputs.run == 'yes'
        # 26 -> 32. SCRAPE_BUDGET_MIN bounds the SWEEP, not the step, so the sweep is free to
        # eat almost the whole step and leave nothing for the write phase behind it. That is what
        # killed 2026-08-21: the sweep took 20.6 min of its 22-min budget -- never binding -- and
        # the filter/insert/prune/reconcile stretch after it needed more than the 5.4 min left.
        # It had taken 2.4 min the run before, on 1,260 boards instead of 1,265.
        #
        # Lowering SCRAPE_BUDGET_MIN instead was the obvious fix and is the wrong one: sources are
        # swept in list order with no rotation, so a tighter budget starves the SAME tail of the
        # board list every single run, silently. Paying for the time is better than quietly
        # dropping employers. The per-phase timing now in scraper.main() is what will say whether
        # the write phase is growing or something in it is broken.
        # 32 -> 55. The step must outlast the whole arithmetic, not just the sweep:
        # 40 (budget) + ~5.4 (the 16 in-flight workers draining, measured -- a handful
        # of Workday tenants take minutes each) + 2 (JD lookup) + ~2.3 (filter, insert,
        # prune, reconcile, board health) = ~50. 55 leaves the same ~1 min of margin
        # the 26-minute version had, which is what 2026-08-21 proved is not optional.
        # 55 -> 120. With SCRAPE_BUDGET_MIN=0 there is no graceful cut any more, so
        # this cap is the ONLY backstop -- and an ungraceful one: a step kill loses
        # the write phase behind the sweep, where the budget used to save every board
        # fetched up to the deadline. It is therefore sized to never be reached in
        # normal operation (~50 min expected) rather than sized to the estimate.
        timeout-minutes: 120
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # FRESHNESS POLICY — keep only roughly the last month of postings.
          # A posting that has been up 30+ days is almost always filled, and on the Supabase
          # free tier every dead row costs space and slows the feed. MAX_AGE_DAYS refuses them
          # on the way in; PRUNE_DAYS removes ones already stored. Both are stated here rather
          # than left to the code defaults so the policy is visible in the run log.
          MAX_AGE_DAYS: "30"
          PRUNE_DAYS: "30"
          # AUTO-DISCOVERY. Probe this many not-yet-scraped employers from migratemate.co's
          # public sponsor directory each run and save any with a readable ATS board, so the
          # board list keeps growing without a code change. ~0.7 companies/sec, so 60 costs
          # ~90s — negligible against the scrape, and it compounds every weekday. The window
          # rotates by day-of-year, which is what makes it work on a stateless runner.
          DISCOVER_LIMIT: "60"
          # Board sweep sizing. MEASURED 2026-08-08 over the full 1,266-board list: 16.0 min
          # at 16 workers (Workday is two thirds of the cost, ~30s a board across 240
          # boards). When the budget binds it says so in the log and still saves every board
          # fetched up to that point.
          #
          # LOWERING THIS DOES NOT SHORTEN THE SWEEP — MEASURED 2026-08-21, both directions.
          # The budget stops DISPATCHING boards at the deadline; the 16 workers already in
          # flight then have to drain, and that drain is ~5.4 min because a handful of Workday
          # tenants take minutes each. So:
          #
          #   budget 22 -> swept all 1265 boards in 20.6 min, 0 skipped
          #   budget 16 -> "budget ran out at 21.4 min", 95 boards SKIPPED
          #
          # Lower bought no time and cost 95 boards, so it went back to 22. No value under
          # ~21 min can do anything until the per-board straggler is capped; that is the fix
          # if the sweep ever has to get shorter. Do not re-tune this number in isolation.
          #
          # The thing that actually overran the 26-minute step is NOT the sweep and not the
          # closed-posting reconcile: it is "JD lookup: fetching 1200 description(s) for
          # title-rejected postings", the description-based admission added 2026-08-20, which
          # runs after the sweep with no budget of its own. It is absent from the 2026-08-20
          # logs and present in both 2026-08-21 failures.
          SCRAPE_WORKERS: "16"
          #
          # 22 -> 40 on 2026-08-24. The board list went 1,265 -> 1,797 (+42%) in one
          # session of company discovery, and Workday alone -- two thirds of the sweep
          # cost at ~30s a board -- went 240 -> 317. Scaling the 20.6-min measurement
          # by boards puts the sweep near 30 min, so 22 would now BIND and starve
          # roughly a quarter of the list every run. 40 is that estimate plus real
          # headroom; the run log prints the actual sweep time and any STARVED count,
          # and that number, not this one, is what to tune against.
          #
          # Note the "no rotation" claim in the step comment above is now STALE:
          # SCRAPE_ROTATE defaults to 1 with a stride of 137, so a binding budget no
          # longer starves the same tail forever. It still starves SOMETHING, which is
          # why the budget went up rather than the rotation being relied on.
          # 0 = NO DEADLINE. scrape_all reads this as
          #     deadline = now + budget*60 if budget > 0 else 0
          # and every check is `if deadline and ...`, so zero disables the cut
          # entirely and every board in the list gets dispatched. That is the point:
          # a budget that binds drops employers silently, and rotation only moves
          # WHICH ones get dropped, it does not stop the dropping.
          #
          # The sweep is still bounded, just not by a wall clock. Each board carries
          # its own request timeouts, and the two ats_types that bring their own HTTP
          # stack are capped explicitly by SCRAPE_BOARD_TIMEOUT -- workday at 300s,
          # jobspy at 90s. So one pathological tenant costs 5 minutes, not the run.
          # Worst case is 317 Workday boards x 300s / 16 workers, which is why the
          # step cap below is generous rather than tight; the realistic figure is
          # ~30 min, scaled from the 20.6 min measured at 1,265 boards.
          #
          # If this ever has to be bounded again, cap the per-board straggler first.
          # Lowering the sweep budget was measured in BOTH directions and bought no
          # time: 16 min still overran at 21.4 min and cost 95 boards.
          SCRAPE_BUDGET_MIN: "0"
          # THE CLOCK ON THE DESCRIPTION LOOKUP — the phase that actually overran this step on
          # 2026-08-21; the reasoning is at JD_LOOKUP_BUDGET_MIN in scraper/__init__.py. The
          # step's arithmetic, all three terms measured: 20.6 min sweep + 2 here + ~2.3 for
          # prune/reconcile/board-health/writes = ~25 of 26, so there is about a minute of
          # margin. 2 rather than the module default of 3 to buy that margin; at ~267 fetches
          # a minute that is ~535 of the 1,200 candidates, and the remainder is offered again
          # next run, because a posting that drops on its title was never stored.
          JD_LOOKUP_BUDGET_MIN: "2"
          # Retire postings that have vanished from their own board. This defaulted to a dry run
          # and was never set here or in bin/cron_scrape.sh, so it has only ever PRINTED what it
          # would do -- 5,178 rows are sitting under the miss threshold and 404 postings still
          # read as open. reconcile_closed carries every guard that made caution sensible: a
          # failed fetch proves nothing, a board returning a small fraction of what we store is
          # skipped, and a posting must miss three consecutive runs before it is closed. Rows
          # are never deleted; Saved and Applied are untouched.
          RECONCILE_CLOSED: "1"
          # JOBSPY — the market-side sweep. Every other source here is employer-side: a job is
          # only visible if its company is already in SOURCES. This queries Indeed by role
          # phrase, so it surfaces employers we have never heard of.
          #
          # MEASURED before enabling (scripts/jobspy_shadow.py, from a home IP, 2026-08-09):
          # 124 rows over 5 phrases at 25 results each, in 8.1s. 81% arrived carrying the
          # EMPLOYER's own direct link rather than an indeed.com URL, which is what lets them
          # merge with the direct scrapers for free instead of becoming a second row. 50.8% were
          # net-new after the full filter chain, and 0 were provable false merges. 90 of the 101
          # direct-link rows were on hosts we do not scrape at all — recruitics, jobvite, apploi,
          # rippling, isolvedhire, Boeing, Abbott — which is the gap this is here to close.
          #
          # INDEED ONLY, deliberately. It is the one site JobSpy itself calls reliable, the one
          # that populates job_url_direct without an extra request per job, and it is unaffected
          # by upstream issue #302 (Google returns 0 rows, ZipRecruiter 403s).
          #
          # INDEED IS THE FINAL SCOPE, not step one of a rollout — decided 2026-08-09 after the
          # sponsorship audit, and worth stating because the staged plan this shipped under said
          # "widen one site at a time" and someone will otherwise pick that up as an instruction.
          #
          # The other four were evaluated and refused. Glassdoor and ZipRecruiter NEVER populate
          # job_url_direct, so every row from them is aggregator-hosted — a second primary key for
          # a job we may already hold, ranked last by web._dupe_rank and refused outright by the
          # autoapply queue. LinkedIn needs linkedin_fetch_description=True to yield a direct URL,
          # which is one extra HTTP request per job and, per JobSpy's own docs, needs proxies to
          # survive from a datacenter IP. Google is the one genuinely worth revisiting: its
          # job_url IS the employer's original link, so it is Class A by construction — gated only
          # on #302 being fixed.
          #
          # The deciding measurement was sponsorship, not volume. JobSpy rows sit below the corpus
          # baseline on every measure that matters here (net H-1B viable 49% vs 67%, STEM OPT 3%
          # vs 11%, no federal record 41% vs 10%), because a keyword sweep returns the long tail
          # of small US employers and that is the population that never sponsors. Widening adds
          # more of exactly that. Re-run scripts/jobspy_shadow.py before revisiting.
          #
          # MIDDAY RUN ONLY. Same ternary as SCORE_MAX_FETCH below: on the afternoon pass this
          # resolves to "", which leaves JOBSPY_BOARDS empty, keeps every jobspy entry out of
          # SOURCES, and never imports the library. One aggregator sweep a day is plenty when
          # hours_old is 72.
          #
          # ROLLBACK is deleting this one line. The rows it already stored come out with
          # `python scripts/prune_by_host.py --host indeed.com --apply`.
          #
          # NOT SET, on purpose: JOBSPY_FINGERPRINT_ENFORCE. The posting-fingerprint check that
          # catches an aggregator relisting a job we already hold runs in LOG-ONLY mode until a
          # real run has been compared against the shadow report's prediction — main() prints
          # what it would have suppressed, broken down by host, and stores the row anyway. Read
          # that breakdown before switching it on: the check keys off "is this an aggregator
          # row", not "did jobspy fetch it", so enforcing it also starts dropping Adzuna
          # relists, which is a wider blast radius than this feature.
          JOBSPY_SITES: ${{ steps.gate.outputs.heavy == 'yes' && 'indeed' || '' }}
          # 100 rather than the ~1000 the endpoint allows. Two identical consecutive Adzuna calls
          # overlapped on only 6 of 50 URLs, so the top of a date-sorted aggregator feed turns
          # over almost completely between runs: depth buys much less than breadth, while every
          # extra page is another request against a site that can decide to stop answering.
          JOBSPY_RESULTS: "100"
          # 72h rather than 24h, so a skipped or failed run does not lose that day's postings
          # permanently. Re-seeing a posting is free, because the url key drops it.
          JOBSPY_HOURS_OLD: "72"
        run: python -m scraper

      # Split into three steps, from one. They used to be three `python -m` lines in a
      # single step, which meant the digest was hostage to the two passes in front of it:
      # verify_dates ran past the job cap, the runner killed the job, and `notify` — the
      # only step that produces something the user actually sees — never ran at all. As
      # separate steps each one is timed and reported on its own, and the digest still goes
      # out when an upstream pass fails or runs out of budget.
      # Runs on EVERY scrape, not just the heavy pass. A job with no fetched JD scores 0 and
      # renders as "JD pending" (core._MIN_JD_CHARS -> web._build_row's score_pending), which
      # means it is invisible to the match-score filter and worthless in the digest. Scoring
      # only in the morning therefore left everything the afternoon scrape found sitting
      # unusable until the next day — the Friday-afternoon special case in the gate above
      # exists solely to patch the worst instance of that, over the weekend.
      #
      # The fetch cap is what makes this affordable twice a day: the heavy run still grinds
      # the standing backlog, while the afternoon run takes a small bite, which is enough to
      # cover the postings that run just found. JDs persist in chunks as they are fetched, so
      # neither pass has to finish to make progress.
      #
      # !cancelled() SO A FAILED SCRAPE STILL GETS SCORED. This was the bare gate, and GitHub
      # skips every remaining step once one fails — so the 2026-08-21 scrape timeout, which
      # happened AFTER the sweep had written the day's rows, skipped this step and left 1,402
      # jobs with a NULL match_score. An unscored row renders as "JD pending" and is invisible
      # to the match filter, so the whole day's intake was unusable for a fault that had
      # nothing to do with scoring. The rows are in the database either way.
      #
      # !cancelled() and NOT always(): the 45-minute job cap must still stop the pipeline
      # rather than start a 15-minute step inside a runner that is already being torn down.
      - name: Score jobs
        id: score
        if: steps.gate.outputs.run == 'yes' && !cancelled()
        timeout-minutes: 26
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SCORE_MAX_FETCH: ${{ steps.gate.outputs.heavy == 'yes' && '3000' || '800' }}
          # Wall-clock stop for the JD fetch, for the same reason verify_dates has one: the
          # count cap does not bound the clock. A measured pass tried 2,640 detail fetches and
          # got 8 usable JDs back — the other 2,632 were dead or blocked URLs that each still
          # cost a timeout, so "3,000 fetches" can mean almost any duration. JDs persist in
          # chunks as they arrive, so stopping early always keeps what it got.
          SCORE_BUDGET_MIN: ${{ steps.gate.outputs.heavy == 'yes' && '9' || '5' }}
          # The midday run re-analyzes the whole corpus, which is also what picks up any
          # résumé edit since yesterday. The 4pm run scores only what it just pulled — same
          # IDF, same result for those jobs, without re-deriving ~20k rows and upserting
          # every score to bank a few hundred changes.
          # 'no'/'yes' rather than '0'/'1' on purpose. GitHub's `a && b || c` is not a real
          # ternary — it returns the first truthy operand — so a true-branch value that casts
          # to false silently yields the FALSE branch instead. '0' is exactly the value where
          # that is arguable, and getting it wrong here would invert the modes and quietly
          # retire the daily full re-score. Two plainly non-empty strings can't misbehave;
          # the Python side treats only 1/true/yes as on.
          SCORE_NEW_ONLY: ${{ steps.gate.outputs.heavy == 'yes' && 'no' || 'yes' }}
          # THIN DESCRIPTIONS — rows that HOLD a JavaScript loading shell or a page title plus a
          # nav bar instead of a description. They score 0 and read blank in the feed exactly
          # like an empty one, but the fetch queue is built from rows whose `jd` is EMPTY, so a
          # junk value used to be sticky forever. 1,533 rows (7.0% of the corpus) were in that
          # state on 2026-08-17.
          #
          # These three are stated here rather than left to the code defaults because they are a
          # POLICY, and the policy is "spend a little, every run, on finding out whether a host
          # has become readable — never spend the budget re-failing the ones that have not."
          #
          # Not a blanket retry, deliberately. ~1,100 of those rows sit on hosts that genuinely
          # cannot be read server-side (Akamai 403, an AWS WAF human-verification challenge, a
          # withdrawn posting), so retrying all of them each run would consume the whole
          # SCORE_MAX_FETCH above and starve the rows that CAN succeed. Instead score_jobs keeps
          # a per-HOST ledger in the scrape_status KV row: 3 rows probed per due host, 150 per
          # run, appended to the TAIL of the queue after the cap so a probe can never displace a
          # row with no description at all. A host that yields real text goes hot and drains up
          # to 400 rows on the following run; a host that fails doubles its backoff, 1 -> 64
          # days. Steady state is ~10-40 extra fetches against the 3,000 cap.
          #
          # Editing scraper/score_jobs.py changes its fingerprint, which re-opens EVERY backed-off
          # host for one round — so shipping a new extractor needs no flag-clearing and cannot be
          # forgotten. That costs at most 150 fetches per deploy of that file.
          #
          # HEAVY PASS ONLY. The values are set unconditionally because main() already gates the
          # whole mechanism on `not new_only`; the cheap pass never loads the corpus these are
          # derived from. Set SCORE_THIN_PROBE to 0 to switch it off without a code change.
          SCORE_THIN_PROBE: "150"
          SCORE_THIN_PER_HOST: "3"
          SCORE_THIN_DRAIN: "400"
          # THE ANALYSIS CLOCK, and the reason this step used to accomplish nothing on a heavy
          # run. core.job_meta is ~206 ms/row against the 622k-term idf, so re-analyzing the
          # corpus is ~79 minutes at 25k rows — measured 2026-08-18. SCORE_BUDGET_MIN above
          # bounds only the JD FETCH, and the single db.update_scores() used to sit below an
          # unbudgeted loop, so this step hit its timeout mid-loop and banked the descriptions
          # it had fetched and NOT ONE SCORE. That is why stored scores were three scoring
          # commits stale until a manual laptop run rewrote them.
          #
          # 4 minutes, not the 79 it would take to finish, because there is nowhere to put 79:
          # the job's own cap is 45 and the steps already over-subscribe it. The pass is now
          # resumable instead — a cursor in scrape_status advances every run, so ~1,165 rows a
          # run (240s / 206ms) walks the 25k corpus in ~22 heavy runs, about a month of
          # weekdays, and each run banks its share in 500-row chunks. Editing the scoring
          # functions or resume.txt resets the cursor to the newest row, so a recalibration
          # starts over rather than leaving the tail on the old scale.
          #
          # 9 (fetch) + 4 (analysis) = 13 minutes of BUDGET, and timeout-minutes below is 26
          # because a step timeout must be a backstop and never a participant.
          #
          # It was 15, i.e. 13 of budget and 2 of slack for "the corpus read and the
          # derived-field writes". MEASURED 2026-09-08 against the live database:
          # db.load_jobs(include_jd=True) -- what this pass does, because it builds IDF over
          # every description -- is 48,567 rows and 264 MB in 122.1 s. The READ ALONE is 2.04
          # min, so it consumed the entire slack and the writes got none.
          #
          # And the writes are not a fixed cost: _persist_derived diffs each row's stored
          # jd_terms against the one it just built, so an ordinary run writes a few hundred
          # rows while a run after a VOCABULARY change writes all of them. 97cdadc changed
          # ATS_KEYWORDS, which is exactly that case.
          #
          # WHY A SIGKILL IS WORSE THAN A SLOW RUN: the budgets exist so the pass exits on its
          # OWN clock and banks its resume cursor. A step timeout lands wherever it lands --
          # including on top of the cursor write -- so the pass stops progressing ACROSS runs
          # rather than walking the corpus a slice at a time. That is a repeated failure, not
          # one bad run.
          #
          # The job's cap is timeout-minutes: 180, not the 45 this comment used to name, so
          # the cap has not been the binding constraint and that sentence sent people to the
          # wrong number.
          #
          # A change that has to land across the corpus NOW is STILL not this step's job --
          # see the note below. Raising this stops the step dying; it does not re-derive
          # 48,567 rows nine minutes at a time.
          #
          # A change that has to land across the corpus NOW is not this step's job: run it
          # unbudgeted and off the clock (`python -m scraper.score_jobs` with no budget set,
          # ~80 min), which is what the 2026-08-18 re-score did.
          SCORE_ANALYZE_BUDGET_MIN: "4"
        run: python -m scraper.score_jobs

      # Real posting dates -> posted_verified. The lookup service allows 60 requests a
      # minute per IP and the script paces itself just under that, so throughput is ~54/min
      # NO MATTER how many workers are used and the only question is how many rows are
      # queued. At ~7.6k queued that is over two hours of calls, which is how this step came
      # to eat a 45-minute job whole. It now stops at VERIFY_BUDGET_MIN and banks its work;
      # the queue shrinks every run because a row the service cannot date is recorded as
      # such instead of being asked about again forever.
      #
      # continue-on-error: a date backfill is an enhancement to rows that already display
      # fine. It must never be the reason the digest below doesn't send. !cancelled() for the
      # reason on Score jobs above: a backfill of rows that already exist does not become
      # pointless because the sweep that ran before it overran its cap.
      # REFILLING user_scores, which this workflow never did. The stored per-(user,job) score
      # table is written by scraper.score_users, and until 2026-09-19 that ran ONLY from the
      # box's weekday cron — acceptable when Actions scraped once a weekday, wrong at eight
      # runs a day across seven days.
      #
      # The coupling lives in the writer: score_jobs DELETES a job's user_scores rows whenever
      # it rewrites that job's jd_terms ("Stored user scores dropped for N re-analysed job(s)"),
      # so every pass above, heavy or light, leaves a hole. Unfilled, web.user_scores falls back
      # to computing those rows per user per request, which is the slow path the table exists to
      # avoid. Measured 2026-09-19: 235 re-analysed jobs -> 1,452 rows refilled across 6
      # accounts in 2m27s. Cheap enough to run every time.
      #
      # continue-on-error: a missed refill degrades to the pre-table behaviour rather than
      # breaking the feed, so it must never fail a run that scraped and scored correctly.
      - name: Refill stored per-user match scores
        if: steps.gate.outputs.run == 'yes' && !cancelled()
        timeout-minutes: 10
        continue-on-error: true
        env:
          EV_OFF: "1"
        # --budget-min 6 is the value bin/cron_scrape.sh uses. An account that cannot finish
        # inside it resumes on the next run instead of blocking the pipeline: score_users writes
        # as it goes and picks up where it stopped, which is what makes a cap safe here.
        run: python -m scraper.score_users --budget-min 6

      - name: Verify posting dates (budgeted)
        if: >-
          steps.gate.outputs.run == 'yes' && steps.gate.outputs.heavy == 'yes'
          && !cancelled()
        # 10 -> 12, and this is FREE: VERIFY_BUDGET_MIN below bounds the work at 8 minutes, so
        # the cap only has to cover that budget plus the corpus load either side of it. It does
        # not: the step measured 9m31s on 2026-09-10 and 8m28s on 09-09 against a 10-minute cap,
        # and it actually hit the cap on 2026-09-07. Raising the cap cannot make the step run
        # longer -- only the budget can do that -- it just stops the fixed overhead from being
        # charged against the budget's headroom.
        timeout-minutes: 12
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          VERIFY_BUDGET_MIN: "8"
        run: python -m scraper.verify_dates --workers 24

      # Naming a status function (!cancelled()) is what stops GitHub applying its default
      # "skip if any earlier step failed" — which is the behaviour that has to go, since a
      # stumble in scoring or date-verification should not silently cost the user their
      # email. The scrape's own outcome is then checked explicitly: the digest describes
      # THIS run's new jobs, so if the sweep didn't finish there is nothing honest to send.
      # Rolls analytics events into daily counts and prunes raw rows past 90 days (and stale
      # tailored_cache entries while it's there). Once a weekday is plenty — the rollup
      # recomputes the last few days and REPLACES those rows, so a skipped run self-heals and a
      # double run cannot double-count.
      #
      # continue-on-error and a tight timeout on purpose: this is housekeeping, and it must
      # never be the reason the digest below doesn't send. It also no-ops cleanly when the
      # events table hasn't been created yet. !cancelled() as on Score jobs above — rolling up
      # yesterday's events has no dependency on today's sweep finishing.
      - name: Roll up + prune analytics events
        if: >-
          steps.gate.outputs.run == 'yes' && steps.gate.outputs.heavy == 'yes'
          && !cancelled()
        timeout-minutes: 4
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/ev_maintain.py --apply

      # The map behind the feed card's "Posted Nx" badge. Derived from the corpus rather than
      # scraped, so it has to run AFTER the sweep — and it is cheap: one description-free select
      # plus in-memory clustering, measured at 28s over 25,180 rows, producing 528 keys.
      #
      # No env block. DB_PROXY_* is set at JOB level and that is the whole transport; the
      # SUPABASE_* pairs on the older steps above are vestigial, and copying them into a new step
      # would propagate dead configuration.
      #
      # continue-on-error and a tight cap for exactly the reason the analytics rollup above has
      # them: a badge is decoration on a feed, and it must never be the reason the digest below
      # does not send.
      #
      # NOTE, and it is why this also lives in bin/cron_scrape.sh: the Actions DB_PROXY_SECRET has
      # been a wrong value since ~2026-08-15 and every scheduled run of this job's later steps
      # fails `401 bad signature`. Until Kunal re-pastes it, THIS STEP IS A NO-OP HERE and the
      # cPanel cron is what actually refreshes the map.
      - name: Publish the repost-cluster map (feed badge)
        if: >-
          steps.gate.outputs.run == 'yes' && steps.gate.outputs.heavy == 'yes'
          && steps.scrape.outcome == 'success' && !cancelled()
        timeout-minutes: 4
        continue-on-error: true
        run: python -m scraper.reposts --write --top 0

      - name: Email the digest (once a day / on manual run)
        if: >-
          steps.gate.outputs.run == 'yes' && steps.gate.outputs.heavy == 'yes'
          && steps.scrape.outcome == 'success' && !cancelled()
        timeout-minutes: 6
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          ALERT_MIN_SCORE: ${{ secrets.ALERT_MIN_SCORE }}
        run: python -m scraper.notify

      # ---- THE TWO PASSES THAT WERE CORRECT AND UNSCHEDULED ---------------------------
      #
      # Both of these were in docs/OPERATIONS.md's tools table and in NO schedule slot, so they
      # ran only when someone remembered. Both feed something the UI states as a fact, which is
      # what makes "nothing runs it" a correctness problem rather than a housekeeping one.
      #
      # THEY LIVE HERE AND NOT IN bin/cron_scrape.sh, and not by preference: `.cpanel.yml`
      # copies the modules, scraper/, resume_brain/, templates/, static/ and bin/cron_scrape.sh,
      # and NOTHING from scripts/ -- build_deploy_zip.py states the policy outright ("scripts/
      # verification tools, not runtime"). Neither file exists on the box, so a crontab line
      # there would fail on every run. This runner has the whole repo checked out.
      #
      # BOTH RUN BEFORE THE WARM BELOW, which is last because everything above it moves
      # jobs_fingerprint() and the warm rebuilds the caches keyed on it. close_dead_jds writes
      # is_active and jd_host_verdicts; build_companies_table bumps the companies version that
      # web._cf_memo and _derived_signature key on. Either one after the warm would invalidate
      # the caches the warm had just filled.
      - name: Close dead postings and clear junk descriptions
        if: >-
          steps.gate.outputs.run == 'yes' && steps.gate.outputs.heavy == 'yes'
          && !cancelled()
        timeout-minutes: 12
        continue-on-error: true
        env:
          EV_OFF: "1"
        # The ONLY thing that can find a posting which now 404s, and the writer of the
        # jd_host_verdicts row web.py reads to decide whether to promise a reader "it'll get a
        # match score once the full job description is fetched". Unscheduled, that promise decays
        # toward false on its own. Measured before this landed: 50.1% of active rows had never
        # been confirmed against their own board by any pass.
        #
        # --per-host and --workers are the bounded form. Its own docstring warns that a count cap
        # does not bound the CLOCK (a dead URL still costs a full timeout), which is why the step
        # carries timeout-minutes as well.
        run: |
          python -u scripts/close_dead_jds.py --apply --per-host 60 --workers 10 --budget-min 8

      - name: Rebuild the employer facts table
        if: >-
          steps.gate.outputs.run == 'yes' && steps.gate.outputs.heavy == 'yes'
          && !cancelled()
        timeout-minutes: 8
        continue-on-error: true
        env:
          EV_OFF: "1"
        # web.company_facts PREFERS this table over sponsor_counts.json / visa_tags.json and only
        # falls back to the files for an employer with no row (~162 new employers a day). So with
        # nothing rebuilding it, refreshing the sponsor JSONs did not move the chip or the star
        # for any employer that already had a row -- two vintages of the same claim rendering
        # side by side, with nothing on the card to tell them apart.
        #
        # --check first so the log says whether it was actually stale, then --apply. --check
        # exits 1 when stale, which is the normal case here, so it must not fail the step.
        run: |
          python scripts/build_companies_table.py --check || echo "(stale or missing, rebuilding)"
          python scripts/build_companies_table.py --apply

      # WARM THE APP BEFORE ANYONE ELSE HAS TO. Everything above moves jobs_fingerprint(),
      # which is the key every cache the website keeps is stored under -- row_cache/,
      # score_cache/, and the per-process IDF table and live analysis that /warm's last two
      # stages fill. Until something rebuilds them the next visitor pays the whole rebuild:
      # measured 2026-09-05 out of the live page_view events, 13,648 ms at 09-05T04:15 and
      # 17,216 ms at 09-06T00:53 against a steady-state feed render of 80-170 ms.
      #
      # NOT GATED ON steps.scrape.outcome, for the same reason the score step below it is not:
      # SCRAPE_SLICE banks every slice as it goes, so a sweep that died at slice 3 of 21 has
      # ALREADY moved the fingerprint. Refusing to warm after a failed run leaves the caches
      # cold precisely when they are most likely to be.
      #
      # heavy is not required either -- a light run still writes rows.
      #
      # NO SECRET, NO STEP. WARM_TOKEN is not a secret this repo has ever needed before; until
      # it is added this prints what to do and exits 0 rather than failing a green run. Use the
      # same value as the `?t=` in the five-minute keep-warm crontab line on the box.
      - name: Warm the app's caches (closes the post-scrape rebuild window)
        if: steps.gate.outputs.run == 'yes' && !cancelled()
        timeout-minutes: 6
        continue-on-error: true
        env:
          WARM_TOKEN: ${{ secrets.WARM_TOKEN }}
          WARM_URL: https://stemjobs1.astrochakra.co/warm
        run: |
          if [ -z "${WARM_TOKEN:-}" ]; then
            echo "No WARM_TOKEN secret set, so the caches this run just invalidated stay cold"
            echo "until the box's five-minute keep-warm cron gets there. Add the repository"
            echo "secret WARM_TOKEN with the same value as the ?t= in that crontab line."
            exit 0
          fi
          # -f so an HTTP error is an error; the per-stage JSON is the point of the output.
          # 404 here means the token is wrong -- the route answers 404 rather than 403 so that
          # an unconfigured deployment does not advertise that it exists.
          curl -fsS -m 300 "$WARM_URL?t=$WARM_TOKEN" && echo

      # SAY SOMETHING WHEN IT BREAKS. The 2026-09-03 run failed at 16:49 UTC and went unnoticed
      # until the next day, because a red tick on the Actions tab is only a notification to
      # somebody who is looking at the Actions tab. A stale feed is invisible from the app —
      # it looks exactly like a quiet week of hiring.
      #
      # `failure()` and not `always()`: this fires when a step that is allowed to fail the job
      # did, which is the four steps without continue-on-error. The housekeeping steps carry
      # continue-on-error precisely because they should not raise an alarm, and this respects
      # that rather than second-guessing it.
      #
      # continue-on-error on the alert itself, so a bad SMTP secret cannot turn one red run into
      # a confusing two. The script also swallows its own send errors; this is the belt to that
      # brace, covering the case where python itself cannot start.
      - name: Say that it failed
        if: failure()
        timeout-minutes: 3
        continue-on-error: true
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          # Named individually rather than dumping the whole steps context: outcome is the
          # value BEFORE continue-on-error is applied, so this reports what actually broke
          # rather than what was allowed to break.
          FAILED_STEPS: >-
            preflight=${{ steps.preflight.outcome || 'n/a' }}
            scrape=${{ steps.scrape.outcome || 'n/a' }}
            score=${{ steps.score.outcome || 'n/a' }}
        run: python scripts/alert_run_failure.py
